<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081426">
<meta name="description" content="Redline — build your momentum.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Redline 2.4</title>
<style>
:root{
  color-scheme:dark;
  --bg:#071426;--panel:#0d1d33;--panel2:#142943;--line:#233b58;
  --ink:#edf4ff;--muted:#91a4bd;--red:#f04459;--red2:#ff6475;
  --green:#55d6a2;--amber:#f4c16b;--blue:#78aaff;--purple:#b99cff;
  --shadow:0 16px 40px #02091455;--radius:20px;--accent-glow:#f0445940;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#edf3fb;--panel:#ffffff;--panel2:#e7eef8;--line:#d2deec;
  --ink:#12243b;--muted:#657991;--red:#d92f49;--red2:#ed4960;
  --green:#16885f;--amber:#a66a0a;--blue:#356fc6;--purple:#7956bd;
  --shadow:0 14px 35px #29415a16;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{min-height:100vh}
.app{animation:appIn .45s ease both}
@keyframes appIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card,.hero,.month-cell,.date-btn{transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.card:hover{border-color:color-mix(in srgb,var(--red) 35%,var(--line))}
.primary:hover,.secondary:hover,.danger:hover{filter:brightness(1.08)}
.primary:active,.secondary:active,.danger:active,.nav button:active{transform:scale(.97)}
.nav button{transition:background .2s,color .2s,transform .2s}
.nav button.active{color:var(--red);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--red) 35%,var(--line))}
.brand{display:flex;align-items:center;gap:0}
.brand:before{content:"";display:inline-block;width:7px;height:23px;border-radius:5px;background:var(--red);margin-right:9px;box-shadow:0 0 18px var(--accent-glow)}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.settings-row:last-child{border:0}
.settings-row>div{min-width:0}
.settings-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--red)}
.profile-chip{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border:1px solid var(--line);border-radius:30px;background:var(--panel2);font-size:12px;color:var(--muted)}
@media(max-width:600px){.nav button{font-size:9px}.nav button span{font-size:17px}.nav-inner{gap:1px}.app{padding-bottom:14px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
body{margin:0;background:radial-gradient(ellipse at 85% 0%,#17365a66,transparent 42%),var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;padding-bottom:100px;transition:background .25s,color .25s}
button,input,textarea,select{font:inherit}
button{cursor:pointer;color:inherit}
button:disabled{opacity:.45;cursor:not-allowed}
.app{max-width:1100px;margin:auto;padding:18px}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 2px 22px;gap:12px}
.brand{font-size:23px;font-weight:950;letter-spacing:2.5px}
.brand span{color:var(--red)}
.top-actions{display:flex;align-items:center;gap:8px}
.level-pill,.icon-btn{background:var(--panel2);border:1px solid var(--line);border-radius:30px;padding:9px 13px;font-size:12px}
.icon-btn{font-size:17px;width:40px;height:40px;padding:0}
.page-heading{margin:12px 0 22px}
.eyebrow{color:var(--red);font-size:10px;font-weight:900;letter-spacing:2px;text-transform:uppercase}
h1{font-size:clamp(30px,6vw,42px);line-height:1.08;margin:9px 0;letter-spacing:-1.2px}
h2{font-size:19px;margin:7px 0}
h3{margin:6px 0}
p{line-height:1.55}
.muted{color:var(--muted);font-size:13px}
.card{background:linear-gradient(145deg,var(--panel),color-mix(in srgb,var(--panel) 88%,var(--blue)));border:1px solid var(--line);border-radius:var(--radius);padding:17px;margin:13px 0;box-shadow:var(--shadow)}
.hero{background:radial-gradient(circle at 90% 0%,#e83d5940,transparent 38%),linear-gradient(135deg,#102d4c,var(--panel) 72%);border:1px solid #34506e;border-radius:25px;padding:23px;margin-bottom:15px;box-shadow:var(--shadow)}
:root[data-theme="light"] .hero{background:radial-gradient(circle at 90% 0%,#ef405322,transparent 40%),linear-gradient(135deg,#e1edfc,#fff 75%);border-color:#c4d5e9}
.hero h1{font-size:clamp(34px,7vw,46px)}
.hero h1 span{color:var(--red)}
.hero p{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat-card{margin:0;padding:15px}
.stat-number{font-size:28px;font-weight:900;margin:9px 0;letter-spacing:-.7px}
.stat-number small{font-size:12px;color:var(--muted)}
.primary,.secondary,.danger{border:0;border-radius:12px;padding:12px 16px;font-weight:800;transition:transform .15s,filter .15s}
.primary{background:linear-gradient(135deg,var(--red),var(--red2));color:white;box-shadow:0 7px 18px #ef405333}
.secondary{background:var(--panel2);border:1px solid var(--line)}
.danger{background:#572632;color:#ffc0c8}
:root[data-theme="light"] .danger{background:#ffe4e8;color:#a51f36}
button:active{transform:scale(.97)}
.block{width:100%;margin-top:9px}
input,textarea,select{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);outline:none}
textarea{resize:vertical;min-height:100px}
input:focus,textarea:focus,select:focus{border-color:var(--red);box-shadow:0 0 0 3px #ef40551c}
.field{margin:13px 0}
.field label{display:block;font-size:10px;letter-spacing:1.5px;color:var(--muted);font-weight:900;margin-bottom:7px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}
.task{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--line)}
.task:last-child{border:0}
.task input[type=checkbox]{width:20px;height:20px;accent-color:var(--red)}
.task.done .task-name{text-decoration:line-through;color:var(--muted)}
.task-name{font-weight:700;flex:1;overflow-wrap:anywhere}
.task small{display:block;color:var(--muted);margin-top:4px;font-weight:500}
.delete{border:0;background:transparent;color:var(--muted);font-size:20px;padding:5px 9px}
.progress-track{height:9px;background:var(--panel2);border-radius:20px;overflow:hidden;margin:12px 0}
.progress-track i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#ff8791);border-radius:20px;transition:width .3s}
.date-strip{display:flex;gap:7px;overflow-x:auto;padding:5px 0 15px}
.date-btn{min-width:49px;padding:9px 5px;background:var(--panel);border:1px solid var(--line);border-radius:13px;display:flex;flex-direction:column;align-items:center;gap:5px}
.date-btn span{font-size:10px;color:var(--muted)}
.date-btn.active{border-color:var(--red);background:color-mix(in srgb,var(--red) 14%,var(--panel))}
.date-btn b{font-size:17px}.date-btn i{font-size:10px;color:var(--green)}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);border-top:1px solid var(--line);padding:9px 5px calc(9px + env(safe-area-inset-bottom));backdrop-filter:blur(18px)}
.nav-inner{max-width:1100px;margin:auto;display:flex;justify-content:space-around;gap:3px}
.nav button{flex:1;border:0;background:transparent;color:var(--muted);padding:9px 2px;border-radius:12px;font-size:10px}
.nav button.active{color:var(--ink);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line)}
.nav button span{display:block;font-size:19px;margin-bottom:4px}
.timer{font-size:clamp(43px,10vw,58px);font-weight:950;letter-spacing:2px;text-align:center;margin:20px 0;font-variant-numeric:tabular-nums}
.timer-ring{width:220px;height:220px;border:8px solid var(--panel2);border-top-color:var(--red);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:20px auto;box-shadow:0 0 35px #ef40551b}
.center{text-align:center}
.quote{font-size:19px;font-weight:750;line-height:1.5;padding:15px 0}
.chart{display:flex;align-items:flex-end;gap:7px;height:150px;padding:15px 0 0}
.bar-col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;min-width:0}
.bar-col i{width:70%;max-width:30px;background:linear-gradient(0deg,var(--red),#ff8a96);border-radius:6px 6px 2px 2px;min-height:2px}
.bar-col span{font-size:9px;color:var(--muted)}
.badge{border:1px solid var(--line);background:var(--panel);padding:12px;border-radius:13px;margin:8px 0}
.badge.unlocked{border-color:var(--amber)}.badge.locked{opacity:.58}
.shop-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.shop-item .emoji{font-size:27px}.shop-item .details{flex:1}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:12px 18px;border-radius:12px;z-index:30;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.toast.show{opacity:1}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;align-items:center;justify-content:center;padding:18px}
.modal.show{display:flex}
.modal-box{width:100%;max-width:500px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.empty{text-align:center;padding:25px 10px;color:var(--muted)}
.small{font-size:11px}
.calendar-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.calendar-toolbar h2{flex:1;text-align:center}
.calendar-controls{display:flex;gap:6px;align-items:center}
.calendar-controls button{padding:9px 12px}
.view-switch{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:12px;flex-wrap:wrap}
.view-switch button{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:8px 10px;font-size:12px}
.view-switch button.active{background:var(--red);color:white}
.cal-weekdays,.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-weekdays{margin-bottom:6px}
.cal-weekdays div{text-align:center;color:var(--muted);font-size:11px;padding:7px 0}
.month-cell{min-height:100px;padding:7px 5px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);text-align:left;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.month-cell.outside{opacity:.35}.month-cell.selected{border:1px solid var(--red);background:color-mix(in srgb,var(--red) 13%,var(--panel2))}
.month-cell.today .day-number{color:var(--red);font-weight:950}
.day-number{font-size:12px}
.event-dot{font-size:10px;padding:3px 5px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#344c6b;color:#e2edff}
.event-dot.task-dot{background:#214b40;color:#b6f3d8}.event-dot.exam-dot{background:#59421f;color:#ffdfa5}
.calendar-day-list{display:flex;flex-direction:column;gap:8px}
.event-card{display:flex;gap:10px;padding:12px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;align-items:flex-start;margin:7px 0}
.event-color{width:4px;min-width:4px;align-self:stretch;border-radius:5px}
.event-content{flex:1;min-width:0}.event-content b{overflow-wrap:anywhere}
.event-actions{display:flex;gap:5px}.event-actions button{padding:6px 9px;font-size:12px}
.agenda-date{font-size:12px;color:var(--red);font-weight:900;margin:18px 0 8px}
.time-grid{overflow:auto;max-height:650px;border:1px solid var(--line);border-radius:13px;background:var(--panel)}
.time-grid-inner{position:relative;min-width:520px}
.time-row{display:grid;grid-template-columns:58px 1fr;min-height:58px;border-bottom:1px solid var(--line)}
.time-label{font-size:10px;color:var(--muted);padding:5px;text-align:center}
.time-slot{position:relative;border-left:1px solid var(--line)}
.time-event{position:absolute;left:64px;right:5px;top:3px;border-radius:7px;padding:6px 8px;font-size:11px;overflow:hidden;z-index:2;border-left:3px solid var(--blue);cursor:pointer}
.note-card{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:17px 48px 17px 16px;min-height:100px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}
.note-edit{position:absolute;top:9px;right:9px;width:34px;height:34px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:17px}
.color-options{display:flex;gap:9px;flex-wrap:wrap}
.color-choice{width:28px;height:28px;border-radius:50%;border:3px solid transparent;padding:0}
.color-choice.active{outline:2px solid var(--ink);outline-offset:2px}
@media(max-width:600px){.app{padding:13px}.month-cell{min-height:70px;padding:5px 3px}.event-dot{font-size:9px;padding:2px 3px}.view-switch button{padding:8px 7px;font-size:11px}.calendar-toolbar{gap:6px}.calendar-toolbar h2{font-size:16px}.level-pill{font-size:10px;padding:8px 10px}}
@media(min-width:650px){.app{padding:25px}.hero{padding:30px}}
.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
.ring{flex:none}.dash{display:flex;gap:18px;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}.tile b{display:block;font-size:20px;margin-top:5px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa button{padding:12px 2px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);font-size:11px;font-weight:700}.qa button span{display:block;font-size:19px;margin-bottom:4px;color:var(--red)}
.top{padding-top:calc(10px + env(safe-area-inset-top))}
</style>
</head>

<script>
window.addEventListener('error',function(e){var d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99;background:#b00020;color:#fff;padding:12px;font:13px monospace;white-space:pre-wrap';d.textContent='ERROR: '+e.message+' (line '+e.lineno+')';document.body.appendChild(d)});
setTimeout(function(){var m=document.getElementById('screen');if(!m||!m.innerHTML.trim()){var d=document.createElement('div');d.style.cssText='padding:20px;color:#fff;font:14px sans-serif';d.textContent='Redline did not render. If no red error shows above, the file was likely cut off when pasted.';document.body.appendChild(d)}},1500);
</script>

<div class="app">
  <header class="top">
    <div class="brand">RED<span>LINE</span></div>
    <div class="top-actions">
      <button class="icon-btn" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle theme">☀</button>
      <div class="level-pill" id="levelPill">LEVEL 1 · 0 XP</div>
    </div>
  </header>
  <main id="screen"></main>
</div>
<nav class="nav"><div class="nav-inner" id="nav"></div></nav>
<div class="toast" id="toast"></div>

<div class="modal" id="taskModal"><div class="modal-box">
  <div class="section-head"><h2>New task</h2><button class="delete" onclick="closeTaskModal()">✕</button></div>
  <div class="field"><label>TASK NAME</label><input id="taskName" maxlength="100" placeholder="What needs to get done?"></div>
  <div class="field"><label>DATE</label><input id="taskDate" type="date"></div>
  <div class="field"><label>CATEGORY</label><select id="taskCat"></select></div>
  <div class="field"><label>PRIORITY</label><select id="taskPri"><option value="0">Normal</option><option value="1">Important</option><option value="2">High</option></select></div>
  <div class="field"><label>REPEAT</label><select id="taskRep"><option value="none">Does not repeat</option><option value="daily">Daily</option><option value="weekly">Weekly</option></select></div>
  <button class="primary block" onclick="addTask()">Add task</button>
</div></div>

<div class="modal" id="eventModal"><div class="modal-box">
  <div class="section-head"><h2 id="eventModalTitle">Create event</h2><button class="delete" onclick="closeEventModal()">✕</button></div>
  <input type="hidden" id="eventEditId">
  <div class="field"><label>EVENT TITLE</label><input id="eventName" maxlength="120" placeholder="Class, meeting, activity..."></div>
  <div class="grid"><div class="field"><label>START DATE</label><input id="eventDate" type="date"></div><div class="field"><label>END DATE</label><input id="eventEndDate" type="date"></div></div>
  <div class="grid"><div class="field"><label>START TIME</label><input id="eventTime" type="time"></div><div class="field"><label>END TIME</label><input id="eventEndTime" type="time"></div></div>
  <div class="field"><label>LOCATION</label><input id="eventLocation" maxlength="120" placeholder="Optional"></div>
  <div class="field"><label>DESCRIPTION</label><textarea id="eventDescription" placeholder="Add details..."></textarea></div>
  <div class="field"><label>CALENDAR</label><select id="eventCategory"><option>Personal</option><option>School</option><option>Work</option><option>Fitness</option><option>Other</option></select></div>
  <div class="field"><label>EVENT COLOUR</label><div class="color-options" id="eventColors"></div></div>
  <div class="field"><label>REPEAT</label><select id="eventRepeat"><option value="none">Does not repeat</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select></div>
  <button class="primary block" onclick="saveEvent()">Save event</button>
</div></div>

<script>
// ==========================================
// REDLINE 2.2 — CORE ENGINE
// Existing rl2-* storage keys are retained.
// ==========================================
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const todayKey=()=>dateKey(new Date());
const addDays=(key,n)=>{const d=fromKey(key);d.setDate(d.getDate()+n);return dateKey(d)};
const read=(key,fallback)=>{try{const v=localStorage.getItem('rl2-'+key);return v===null?fallback:JSON.parse(v)}catch(e){return fallback}};
const write=(key,value)=>{try{localStorage.setItem('rl2-'+key,JSON.stringify(value))}catch(e){console.warn('Storage write failed',e)}};

let tasks=read('tasks',[]),cats=read('cats',['Study','Personal','Fitness','Other']);
let focus=read('focus',{}),exams=read('exams',[]),notes=read('notes',{}),events=read('events',[]);
let xp=Number(read('xp',0))||0,coins=Number(read('coins',0))||0;
let xpAwards=read('xpAwards',{}),owned=read('owned',['default']),avatar=read('avatar','default');
let challenges=read('challenges',[]),completedDays=read('completedDays',[]);
let weeklyGoal=Number(read('goal',20))||20;
let tab='today',selectedDate=todayKey(),calendarMonth=new Date(),calendarView='month';
let calendarSearch='',calendarFilter='All',selectedEventColor='#78aaff',editingNote=false;
let timerLength=Number(read('timerLength',1500))||1500,timerLeft=timerLength,timerEndAt=Number(read('timerEndAt',0))||0,timerId=null;
let timerRunning=timerEndAt>Date.now();
let currentQuote=read('quote',0);
let theme=read('theme','dark');
let profileName=String(read('profileName','Operator')||'Operator');
let reducedMotion=Boolean(read('reducedMotion',false));

const NAV=[['today','⌂','Today'],['calendar','▦','Plan'],['focus','◷','Focus'],['progress','↗','Progress'],['more','☷','More'],['settings','⚙','Settings']];
const COLORS=['#78aaff','#55d6a2','#f04459','#f4c16b','#b99cff','#ff91c8','#69d8dc','#b2b6c2'];
const QUOTES=['Discipline beats motivation.','Small steps. Serious results.','You do not need to be perfect. You need to be consistent.','Your future is built by what you do today.','Start before you feel ready.','One focused hour can change your day.','Stop waiting. Start doing.','Make your actions match your ambitions.','Consistency creates confidence.','Do the work. Let the results speak.','Progress is still progress, no matter how small.','Your only competition is who you were yesterday.','A little every day adds up.','Stay patient. Stay disciplined.','You can restart as many times as you need.','Make today count.','Focus on the next step, not the whole staircase.','Hard work is a habit, not a mood.','Build a life you are proud of.','Less excuses. More execution.'];


function save(){
write('tasks',tasks);write('cats',cats);write('focus',focus);write('exams',exams);write('notes',notes);write('events',events);
write('xp',xp);write('coins',coins);write('xpAwards',xpAwards);write('owned',owned);write('avatar',avatar);
write('challenges',challenges);write('completedDays',completedDays);write('goal',weeklyGoal);write('timerEndAt',timerEndAt);write('timerLength',timerLength);write('profileName',profileName);write('reducedMotion',reducedMotion);
}
function escapeHTML(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(window.toastTimeout);window.toastTimeout=setTimeout(()=>el.classList.remove('show'),2300)}
function level(){return Math.floor(xp/100)+1}
function levelXP(){return xp%100}
function awardXP(amount){xp+=amount;save();toast(`+${amount} XP`)}
function completedCount(){return tasks.filter(t=>t.done).length}
function dayTasks(key){return tasks.filter(t=>t.date===key)}
function streak(){let count=0,d=new Date();if(!completedDays.includes(dateKey(d)))d.setDate(d.getDate()-1);while(completedDays.includes(dateKey(d))){count++;d.setDate(d.getDate()-1)}return count}
function formatDate(key,options={weekday:'short',month:'short',day:'numeric'}){return fromKey(key).toLocaleDateString('en-IN',options)}

function closeTaskModal(){$('taskModal').classList.remove('show')}
function ensureRecurringSchedule(){
const roots=tasks.filter(t=>t.rep&&t.rep!=='none'&&!t.generated);
roots.forEach(root=>{if(!root.seriesId)root.seriesId=root.id;const start=fromKey(root.date),end=new Date(start.getFullYear(),11,31);
for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){const diff=Math.round((d-start)/86400000),matches=root.rep==='daily'||(root.rep==='weekly'&&diff%7===0);if(!matches||diff===0)continue;const key=dateKey(d);if(!tasks.some(t=>t.seriesId===root.seriesId&&t.date===key))tasks.push({...root,id:Date.now()+Math.random(),date:key,done:false,generated:true})}
})}
function addTask(){const text=$('taskName').value.trim(),date=$('taskDate').value;if(!text||!date){toast('Enter a task and date');return}
const task={id:Date.now()+Math.random(),text,date,cat:$('taskCat').value,pri:Number($('taskPri').value),rep:$('taskRep').value,done:false,generated:false,seriesId:null};
if(task.rep!=='none')task.seriesId=task.id;tasks.push(task);ensureRecurringSchedule();save();closeTaskModal();render();toast('Task added')}
function toggleTask(id){const task=tasks.find(t=>t.id==id);if(!task)return;task.done=!task.done;task.doneAt=task.done?new Date().toISOString():null;
if(task.done&&!xpAwards[String(task.id)]){xpAwards[String(task.id)]=true;awardXP(10)}
const todays=dayTasks(todayKey());if(todays.length&&todays.every(t=>t.done)&&!completedDays.includes(todayKey())){completedDays.push(todayKey());awardXP(20);toast('Perfect day! +20 XP')}
save();render()}
function deleteTask(id){const task=tasks.find(t=>t.id==id);if(!task)return;if(task.seriesId){tasks=tasks.filter(t=>t.seriesId!==task.seriesId||t.date<task.date||t.done);tasks.forEach(t=>{if(t.seriesId===task.seriesId)t.rep='none'})}else tasks=tasks.filter(t=>t.id!=id);save();render();toast('Task deleted')}

function updateTimer(){if(timerRunning){timerLeft=Math.max(0,Math.ceil((timerEndAt-Date.now())/1000));if(timerLeft<=0){timerRunning=false;timerEndAt=0;const key=todayKey();focus[key]=(focus[key]||0)+timerLength;awardXP(25);save();clearInterval(timerId);timerId=null;toast('Focus session complete!')}}if(tab==='focus')renderFocus()}
function startTimer(){if(timerRunning)return;if(timerLeft<=0)timerLeft=timerLength;timerEndAt=Date.now()+timerLeft*1000;timerRunning=true;save();clearInterval(timerId);timerId=setInterval(updateTimer,1000);render()}
function pauseTimer(){if(!timerRunning)return;timerLeft=Math.max(0,Math.ceil((timerEndAt-Date.now())/1000));timerRunning=false;timerEndAt=0;clearInterval(timerId);timerId=null;save();render()}
function resetTimer(){timerRunning=false;timerEndAt=0;timerLeft=timerLength;clearInterval(timerId);timerId=null;save();render()}
function setTimer(minutes){if(timerRunning)return;timerLength=minutes*60;timerLeft=timerLength;save();render()}

function setCalendarView(view){calendarView=view;render()}

function setCalendarSearch(v){calendarSearch=v;const pos=$('calendarSearch')?.selectionStart;render();const el=$('calendarSearch');if(el){el.focus();el.setSelectionRange(pos,pos)}}
function eventMatchesDate(e,key){if(key<e.date)return false;const repeat=e.repeat||'none';if(repeat==='none')return key>=e.date&&key<=(e.endDate||e.date);if(e.repeatUntil&&key>e.repeatUntil)return false;const start=fromKey(e.date),cur=fromKey(key);if(repeat==='daily')return true;if(repeat==='weekly')return Math.round((cur-start)/86400000)%7===0;if(repeat==='monthly')return cur.getDate()===start.getDate();if(repeat==='yearly')return cur.getMonth()===start.getMonth()&&cur.getDate()===start.getDate();return false}
function eventsOn(key){return events.filter(e=>eventMatchesDate(e,key)).filter(e=>calendarFilter==='All'||e.category===calendarFilter).filter(e=>!calendarSearch||(e.name+' '+(e.location||'')+' '+(e.description||'')).toLowerCase().includes(calendarSearch.toLowerCase()))}
function openEventModal(id=null){const e=id?events.find(x=>x.id==id):null;$('eventModalTitle').textContent=e?'Edit event':'Create event';$('eventEditId').value=e?e.id:'';$('eventName').value=e?.name||'';$('eventDate').value=e?.date||selectedDate;$('eventEndDate').value=e?.endDate||e?.date||selectedDate;$('eventTime').value=e?.time||'09:00';$('eventEndTime').value=e?.endTime||'10:00';$('eventLocation').value=e?.location||'';$('eventDescription').value=e?.description||'';$('eventCategory').value=e?.category||'Personal';$('eventRepeat').value=e?.repeat||'none';selectedEventColor=e?.color||COLORS[0];$('eventColors').innerHTML=COLORS.map(c=>`<button type="button" class="color-choice ${c===selectedEventColor?'active':''}" style="background:${c}" onclick="chooseEventColor('${c}',this)"></button>`).join('');$('eventModal').classList.add('show')}

function saveEvent(){const name=$('eventName').value.trim(),date=$('eventDate').value,endDate=$('eventEndDate').value||date,time=$('eventTime').value,endTime=$('eventEndTime').value;if(!name||!date||!time||!endTime){toast('Fill in the title, date and times');return}if(endDate<date||(endDate===date&&endTime<=time)){toast('End must be after start');return}
const oldId=$('eventEditId').value,e={id:oldId?oldId:Number(Date.now()),name,date,endDate,time,endTime,location:$('eventLocation').value.trim(),description:$('eventDescription').value.trim(),category:$('eventCategory').value,color:selectedEventColor,repeat:$('eventRepeat').value};

// BACKUP / RESTORE
function exportData(){const data={tasks,cats,focus,exams,notes,events,xp,coins,xpAwards,owned,avatar,challenges,completedDays,weeklyGoal,profileName,reducedMotion};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='redline-backup.json';a.click();URL.revokeObjectURL(url);toast('Backup exported')}
function importData(input){const file=input.files?.[0];if(!file)return;if(!confirm('Restoring replaces ALL current data. Continue?')){input.value='';return}const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);tasks=Array.isArray(d.tasks)?d.tasks:[];cats=Array.isArray(d.cats)?d.cats:cats;focus=d.focus||{};exams=d.exams||[];notes=d.notes||{};events=d.events||[];xp=Number(d.xp)||0;coins=Number(d.coins)||0;xpAwards=d.xpAwards||{};owned=d.owned||['default'];avatar=d.avatar||'default';challenges=d.challenges||[];completedDays=d.completedDays||[];weeklyGoal=Number(d.weeklyGoal)||20;profileName=String(d.profileName||profileName||'Operator');reducedMotion=Boolean(d.reducedMotion);ensureRecurringSchedule();applyTheme();save();render();toast('Backup restored')}catch(e){toast('Invalid backup file')}};reader.readAsText(file)}

// NAVIGATION / RENDER
function renderNav(){$('nav').innerHTML=NAV.map(n=>`<button class="${tab===n[0]?'active':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')}
function render(){renderNav();$('levelPill').textContent=`LEVEL ${level()} · ${xp} XP`;const screens={today:renderToday,calendar:renderCalendar,focus:renderFocus,progress:renderStats,more:renderMore,settings:renderSettings};try{(screens[tab]||renderToday)()}catch(err){console.error(err);$('screen').innerHTML=`<section class="card"><h2>This screen hit an error</h2><p class="muted">${escapeHTML(err.message)}</p><button class="primary block" onclick="go('today')">Back to Today</button></section>`}}

// DASHBOARD HELPERS (2.4)
function ring(p){const r=52,c=2*Math.PI*r;return `<svg class="ring" width="124" height="124" viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--panel2)" stroke-width="10"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--red)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p/100)}" transform="rotate(-90 60 60)" style="transition:stroke-dashoffset .6s"/><text x="60" y="67" text-anchor="middle" fill="var(--ink)" font-size="24" font-weight="900">${p}%</text></svg>`}
function greeting(){const h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening'}
function quickNote(){selectedDate=todayKey();editingNote=true;tab='today';render();setTimeout(()=>$('noteInput')?.focus(),60)}
function dashTop(key,list,done,percent){
const wk=(Array.from({length:7},(_,i)=>focus[addDays(todayKey(),-i)]||0).reduce((a,b)=>a+b,0)/3600).toFixed(1);
const pri=list.filter(t=>!t.done).sort((a,b)=>(b.pri||0)-(a.pri||0)).slice(0,3);
const dl=exams.filter(e=>e.date>=todayKey()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);
return `<div class="page-heading"><div class="eyebrow">${greeting()}, ${escapeHTML(profileName)}</div><h1>${key===todayKey()?'Command centre.':'Your schedule.'}</h1><p class="muted">${formatDate(key,{weekday:'long',month:'long',day:'numeric',year:'numeric'})} · ${new Date().toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'})}</p></div>
<section class="hero"><div class="dash">${ring(percent)}<div><div class="eyebrow">DAILY PROGRESS</div><h1>${done}<span> / ${list.length}</span></h1><p>Tasks completed</p></div></div><div class="progress-track"><i style="width:${levelXP()}%"></i></div><div class="muted small">Level ${level()} · ${levelXP()} / 100 XP</div></section>
<div class="tiles"><div class="tile"><span class="eyebrow">STREAK</span><b>${streak()} 🔥</b></div><div class="tile"><span class="eyebrow">FOCUS TODAY</span><b>${totalFocus(todayKey())}m</b></div><div class="tile"><span class="eyebrow">7 DAYS</span><b>${wk}h</b></div></div>
<div class="qa"><button onclick="openTaskModal()"><span>＋</span>Task</button><button onclick="go('focus')"><span>◷</span>Focus</button><button onclick="openEventModal()"><span>▦</span>Event</button><button onclick="quickNote()"><span>✎</span>Note</button></div>
<div class="section-head"><h2>Priorities</h2></div><section class="card">${pri.length?pri.map(t=>`<div class="task"><div class="task-name">${escapeHTML(t.text)}<small>${escapeHTML(t.cat)} · ${['Normal','Important','High'][t.pri||0]}</small></div></div>`).join(''):'<div class="empty">Nothing pending. Clear skies.</div>'}</section>
<div class="section-head"><h2>Upcoming deadlines</h2></div><section class="card">${dl.length?dl.map(e=>{const d=Math.ceil((fromKey(e.date)-fromKey(todayKey()))/86400000);return `<div class="task"><div class="task-name">🎓 ${escapeHTML(e.name)}<small>${formatDate(e.date)} · ${d===0?'Today':d+' days left'}</small></div></div>`}).join(''):'<div class="empty">No deadlines ahead.</div>'}</section>`}
function catBreakdown(){const m={};tasks.filter(t=>t.done).forEach(t=>m[t.cat]=(m[t.cat]||0)+1);const e=Object.entries(m).sort((a,b)=>b[1]-a[1]);if(!e.length)return '<section class="card"><h2>By category</h2><div class="empty">Complete tasks to see your breakdown.</div></section>';const tot=e.reduce((a,x)=>a+x[1],0);let acc=0;const stops=e.map((x,i)=>{const s0=acc/tot*100;acc+=x[1];return `${COLORS[i%COLORS.length]} ${s0}% ${acc/tot*100}%`}).join(',');const mk='radial-gradient(circle 36px,transparent 97%,#000 100%)';return `<section class="card"><h2>By category</h2><div class="dash"><div style="flex:none;width:120px;height:120px;border-radius:50%;background:conic-gradient(${stops});-webkit-mask:${mk};mask:${mk}"></div><div>${e.map((x,i)=>`<div class="muted"><span style="color:${COLORS[i%COLORS.length]}">●</span> ${escapeHTML(x[0])} · ${x[1]}</div>`).join('')}</div></div></section>`}

// TODAY
function renderToday(){const key=selectedDate,list=dayTasks(key),done=list.filter(t=>t.done).length,percent=list.length?Math.round(done/list.length*100):0;const start=new Date();start.setDate(start.getDate()-start.getDay());const week=Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d});
const dateButtons=week.map(d=>{const k=dateKey(d),count=dayTasks(k).filter(t=>t.done).length;return `<button class="date-btn ${k===key?'active':''}" onclick="chooseDate('${k}')"><span>${d.toLocaleDateString('en-IN',{weekday:'short'})}</span><b>${d.getDate()}</b><i>${count?count+' ✓':''}</i></button>`}).join('');
const taskHTML=list.length?list.map(t=>`<div class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><div class="task-name">${escapeHTML(t.text)}<small>${escapeHTML(t.cat)} · ${['Normal','Important','High'][t.pri||0]}</small></div><button class="delete" onclick="deleteTask('${t.id}')">×</button></div>`).join(''):'<div class="empty">No tasks scheduled for this day.</div>';
const note=notes[key]||'',dayEvents=eventsOn(key);
$('screen').innerHTML=`${dashTop(key,list,done,percent)}
<div class="date-strip">${dateButtons}</div>
<div class="section-head"><h2>Tasks</h2><button class="primary" onclick="openTaskModal()">+ Add task</button></div><section class="card">${taskHTML}</section>
<div class="section-head"><h2>Events</h2><button class="secondary" onclick="openEventModal()">+ Event</button></div><section class="card">${dayEvents.length?dayEvents.map(e=>`<div class="event-card"><div class="event-color" style="background:${e.color}"></div><div class="event-content"><b>${escapeHTML(e.name)}</b><div class="muted">${formatTime(e.time)} – ${formatTime(e.endTime)} · ${escapeHTML(e.category)}</div>${e.location?`<div class="muted">📍 ${escapeHTML(e.location)}</div>`:''}</div><button class="delete" onclick="openEventModal('${e.id}')">✎</button></div>`).join(''):'<div class="empty">Nothing scheduled.</div>'}</section>
<div class="section-head"><h2>Daily note</h2></div><section class="card">${note&&!editingNote?`<div class="note-card">${escapeHTML(note)}<button class="note-edit" onclick="editNote()">✎</button></div>`:`<textarea id="noteInput" placeholder="Write down your thoughts, plans or daily summary...">${escapeHTML(note)}</textarea><button class="primary block" onclick="saveNote()">Save note</button>${note?'<button class="secondary block" onclick="cancelNoteEdit()">Cancel</button>':''}`}</section>
<section class="card"><div class="eyebrow">DAILY REMINDER</div><div class="quote">"${QUOTES[currentQuote%QUOTES.length]}"</div><button class="secondary block" onclick="newQuote()">↻ New quote</button></section>`}

// CALENDAR
function renderCalendar(){const monthName=calendarMonth.toLocaleDateString('en-IN',{month:'long',year:'numeric'}),viewButtons=['month','week','day','agenda'].map(v=>`<button class="${calendarView===v?'active':''}" onclick="setCalendarView('${v}')">${v[0].toUpperCase()+v.slice(1)}</button>`).join('');let content='';
if(calendarView==='month'){const first=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth(),1),gridStart=new Date(first);gridStart.setDate(1-first.getDay());let cells='';
for(let i=0;i<42;i++){const d=new Date(gridStart);d.setDate(gridStart.getDate()+i);const key=dateKey(d),de=eventsOn(key),dt=dayTasks(key),ex=exams.filter(x=>x.date===key);cells+=`<button class="month-cell ${d.getMonth()!==calendarMonth.getMonth()?'outside':''} ${key===selectedDate?'selected':''} ${key===todayKey()?'today':''}" onclick="chooseDate('${key}')" ondragover="allowDrop(event)" ondrop="dropEvent(event,'${key}')"><span class="day-number">${d.getDate()}</span>${de.slice(0,2).map(e=>`<span class="event-dot" style="background:${e.color};color:#101114" draggable="true" ondragstart="dragEvent(event,'${e.id}')">${escapeHTML(e.name)}</span>`).join('')}${dt.length?`<span class="event-dot task-dot">${dt.length} tasks</span>`:''}${ex.map(e=>`<span class="event-dot exam-dot">🎓 ${escapeHTML(e.name)}</span>`).join('')}${de.length>2?`<span class="small muted">+${de.length-2} more</span>`:''}</button>`}
content=`<div class="cal-weekdays">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div>${d}</div>`).join('')}</div><div class="month-grid">${cells}</div><div class="muted small" style="margin-top:12px">Select a date to see its tasks and events. Drag events to reschedule on desktop.</div>`}
if(calendarView==='week'||calendarView==='day'){const start=fromKey(selectedDate);if(calendarView==='week')start.setDate(start.getDate()-start.getDay());const days=calendarView==='week'?7:1;
content=`<div class="calendar-day-list" style="margin-bottom:12px">${Array.from({length:days},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);const k=dateKey(d);return `<button class="secondary" onclick="chooseDate('${k}')">${formatDate(k,{weekday:'short',month:'short',day:'numeric'})}${k===selectedDate?' · Selected':''}</button>`}).join('')}</div>
<div class="time-grid"><div class="time-grid-inner">${Array.from({length:18},(_,i)=>`<div class="time-row"><div class="time-label">${formatTime(`${pad(i+6)}:00`)}</div><div class="time-slot"></div></div>`).join('')}
${Array.from({length:days},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return eventsOn(dateKey(d)).map(e=>{const [h,m]=(e.time||'09:00').split(':').map(Number),[eh,em]=(e.endTime||'10:00').split(':').map(Number),top=(h-6)*58+m/60*58,height=Math.max(30,((eh-h)+(em-m)/60)*58);if(top<0||top>1044)return '';return `<div class="time-event" style="top:${top}px;height:${height}px;background:${e.color}33;border-color:${e.color};left:${64+i*100/days}%;right:${Math.max(5,(days-i-1)*100/days)}%" onclick="openEventModal('${e.id}')"><b>${escapeHTML(e.name)}</b><br>${formatTime(e.time)}</div>`}).join('')}).join('')}</div></div><button class="primary block" onclick="openEventModal()">+ Add event</button>`}
if(calendarView==='agenda'){let rows='';for(let i=0;i<90;i++){const k=addDays(todayKey(),i),de=eventsOn(k),dt=dayTasks(k),dx=exams.filter(e=>e.date===k);if(!de.length&&!dt.length&&!dx.length)continue;rows+=`<div class="agenda-date">${formatDate(k,{weekday:'long',month:'long',day:'numeric'})}</div>${de.map(e=>`<div class="event-card"><div class="event-color" style="background:${e.color}"></div><div class="event-content"><b>${escapeHTML(e.name)}</b><div class="muted">${formatTime(e.time)} – ${formatTime(e.endTime)}</div></div><button class="delete" onclick="openEventModal('${e.id}')">✎</button></div>`).join('')}${dt.map(t=>`<div class="event-card"><div class="event-color" style="background:var(--green)"></div><div class="event-content"><b>${escapeHTML(t.text)}</b><div class="muted">Task · ${t.done?'Completed':'Pending'}</div></div></div>`).join('')}${dx.map(e=>`<div class="event-card"><div class="event-color" style="background:var(--amber)"></div><div class="event-content"><b>🎓 ${escapeHTML(e.name)}</b></div></div>`).join('')}`}content=rows||'<div class="empty">No upcoming items in the next 90 days.</div>'}
const selectedEvents=eventsOn(selectedDate);
$('screen').innerHTML=`<div class="page-heading"><div class="eyebrow">PLAN YOUR TIME</div><h1>Calendar.</h1><p class="muted">Your tasks, events and schedule in one place.</p></div>
<section class="card"><div class="calendar-toolbar"><div class="calendar-controls"><button class="secondary" onclick="changeCalendar(-1)">‹</button><button class="secondary" onclick="calendarToday()">Today</button><button class="secondary" onclick="changeCalendar(1)">›</button></div><h2>${monthName}</h2><button class="primary" onclick="openEventModal()">+ Event</button></div>
<div class="section-head"><div class="view-switch">${viewButtons}</div></div>
