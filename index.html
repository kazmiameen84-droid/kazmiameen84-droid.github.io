<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081426">
<meta name="description" content="Redline — build your momentum.">
<title>Redline 2.3</title>
<style>
:root{
  color-scheme:dark;
  --bg:#071426;--panel:#0d1d33;--panel2:#142943;--line:#233b58;
  --ink:#edf4ff;--muted:#91a4bd;--red:#f04459;--red2:#ff6475;
  --green:#55d6a2;--amber:#f4c16b;--blue:#78aaff;--purple:#b99cff;
  --shadow:0 16px 40px #02091455;--radius:20px;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#edf3fb;--panel:#fff;--panel2:#e7eef8;--line:#d2deec;
  --ink:#12243b;--muted:#657991;--red:#d92f49;--red2:#ed4960;
  --green:#16885f;--amber:#a66a0a;--blue:#356fc6;--purple:#7956bd;
  --shadow:0 14px 35px #29415a16;
}
*{box-sizing:border-box}
body{
  margin:0;background:radial-gradient(ellipse at 85% 0%,#17365a66,transparent 42%),var(--bg);
  color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;
  padding-bottom:100px;transition:background .25s,color .25s;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer;color:inherit}
button:disabled{opacity:.45;cursor:not-allowed}
.app{max-width:1400px;margin:auto;padding:22px}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 2px 25px;gap:12px}
.brand{font-size:25px;font-weight:950;letter-spacing:3px}
.brand span{color:var(--red)}
.top-actions{display:flex;align-items:center;gap:8px}
.level-pill,.icon-btn{background:var(--panel2);border:1px solid var(--line);border-radius:30px;padding:9px 13px;font-size:12px}
.icon-btn{font-size:17px;width:40px;height:40px;padding:0}
.page-heading{margin:12px 0 22px}
.eyebrow{color:var(--red);font-size:10px;font-weight:900;letter-spacing:2px;text-transform:uppercase}
h1{font-size:clamp(30px,6vw,46px);line-height:1.08;margin:9px 0;letter-spacing:-1.2px}
h2{font-size:19px;margin:7px 0}
h3{margin:6px 0}
p{line-height:1.55}
.muted{color:var(--muted);font-size:13px}
.card{
  background:linear-gradient(145deg,var(--panel),color-mix(in srgb,var(--panel) 88%,var(--blue)));
  border:1px solid var(--line);border-radius:var(--radius);padding:19px;margin:13px 0;
  box-shadow:var(--shadow);transition:transform .2s,border-color .2s;
}
.card:hover{border-color:#456789}
.hero{
  background:radial-gradient(circle at 90% 0%,#e83d5940,transparent 38%),linear-gradient(135deg,#102d4c,var(--panel) 72%);
  border:1px solid #34506e;border-radius:25px;padding:27px;margin-bottom:17px;box-shadow:var(--shadow);
}
:root[data-theme="light"] .hero{background:radial-gradient(circle at 90% 0%,#ef405322,transparent 40%),linear-gradient(135deg,#e1edfc,#fff 75%);border-color:#c4d5e9}
.hero h1{font-size:clamp(34px,7vw,48px)}
.hero h1 span{color:var(--red)}
.hero p{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat-card{margin:0;padding:17px}
.stat-number{font-size:29px;font-weight:900;margin:9px 0;letter-spacing:-.7px}
.stat-number small{font-size:12px;color:var(--muted)}
.primary,.secondary,.danger{
  border:0;border-radius:12px;padding:12px 16px;font-weight:800;
  transition:transform .18s,filter .18s,box-shadow .18s;
}
.primary{background:linear-gradient(135deg,var(--red),var(--red2));color:white;box-shadow:0 7px 18px #ef405333}
.secondary{background:var(--panel2);border:1px solid var(--line)}
.danger{background:#572632;color:#ffc0c8}
:root[data-theme="light"] .danger{background:#ffe4e8;color:#a51f36}
button:hover{filter:brightness(1.1)}
button:active{transform:scale(.96)}
.block{width:100%;margin-top:9px}
input,textarea,select{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);outline:none}
textarea{resize:vertical;min-height:100px}
input:focus,textarea:focus,select:focus{border-color:var(--red);box-shadow:0 0 0 3px #ef40551c}
.field{margin:13px 0}
.field label{display:block;font-size:10px;letter-spacing:1.5px;color:var(--muted);font-weight:900;margin-bottom:7px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}
.task{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--line)}
.task:last-child{border:0}
.task input[type=checkbox]{width:20px;height:20px;accent-color:var(--red)}
.task.done .task-name{text-decoration:line-through;color:var(--muted)}
.task-name{font-weight:700;flex:1;overflow-wrap:anywhere}
.task small{display:block;color:var(--muted);margin-top:4px;font-weight:500}
.delete{border:0;background:transparent;color:var(--muted);font-size:20px;padding:5px 9px}
.progress-track{height:9px;background:var(--panel2);border-radius:20px;overflow:hidden;margin:12px 0}
.progress-track i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#ff8791);border-radius:20px;transition:width .4s}
.date-strip{display:flex;gap:7px;overflow-x:auto;padding:5px 0 15px}
.date-btn{min-width:49px;padding:9px 5px;background:var(--panel);border:1px solid var(--line);border-radius:13px;display:flex;flex-direction:column;align-items:center;gap:5px}
.date-btn span{font-size:10px;color:var(--muted)}
.date-btn.active{border-color:var(--red);background:color-mix(in srgb,var(--red) 14%,var(--panel))}
.date-btn b{font-size:17px}.date-btn i{font-size:10px;color:var(--green)}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);border-top:1px solid var(--line);padding:9px 5px calc(9px + env(safe-area-inset-bottom));backdrop-filter:blur(18px)}
.nav-inner{max-width:1100px;margin:auto;display:flex;justify-content:space-around;gap:4px}
.nav button{flex:1;border:0;background:transparent;color:var(--muted);padding:9px 2px;border-radius:12px;font-size:10px}
.nav button.active{color:var(--ink);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line)}
.nav button span{display:block;font-size:19px;margin-bottom:4px}
.timer{font-size:clamp(43px,10vw,58px);font-weight:950;letter-spacing:2px;text-align:center;margin:20px 0;font-variant-numeric:tabular-nums}
.timer-ring{width:220px;height:220px;border:8px solid var(--panel2);border-top-color:var(--red);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:20px auto;box-shadow:0 0 35px #ef40551b}
.center{text-align:center}
.quote{font-size:19px;font-weight:750;line-height:1.5;padding:15px 0}
.chart{display:flex;align-items:flex-end;gap:7px;height:150px;padding:15px 0 0}
.bar-col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;min-width:0}
.bar-col i{width:70%;max-width:30px;background:linear-gradient(0deg,var(--red),#ff8a96);border-radius:6px 6px 2px 2px;min-height:2px}
.bar-col span{font-size:9px;color:var(--muted)}
.badge{border:1px solid var(--line);background:var(--panel);padding:12px;border-radius:13px;margin:8px 0}
.badge.unlocked{border-color:var(--amber)}.badge.locked{opacity:.58}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:12px 18px;border-radius:12px;z-index:30;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.toast.show{opacity:1}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;align-items:center;justify-content:center;padding:18px}
.modal.show{display:flex}
.modal-box{width:100%;max-width:500px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.empty{text-align:center;padding:25px 10px;color:var(--muted)}
.small{font-size:11px}
.calendar-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.calendar-toolbar h2{flex:1;text-align:center}
.calendar-controls{display:flex;gap:6px;align-items:center}
.calendar-controls button{padding:9px 12px}
.view-switch{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:12px;flex-wrap:wrap}
.view-switch button{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:8px 10px;font-size:12px}
.view-switch button.active{background:var(--red);color:white}
.cal-weekdays,.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-weekdays{margin-bottom:6px}
.cal-weekdays div{text-align:center;color:var(--muted);font-size:11px;padding:7px 0}
.month-cell{min-height:100px;padding:7px 5px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);text-align:left;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.month-cell.outside{opacity:.35}.month-cell.selected{border:1px solid var(--red);background:color-mix(in srgb,var(--red) 13%,var(--panel2))}
.month-cell.today .day-number{color:var(--red);font-weight:950}
.day-number{font-size:12px}
.event-dot{font-size:10px;padding:3px 5px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#344c6b;color:#e2edff}
.event-dot.task-dot{background:#214b40;color:#b6f3d8}.event-dot.exam-dot{background:#59421f;color:#ffdfa5}
.calendar-day-list{display:flex;flex-direction:column;gap:8px}
.event-card{display:flex;gap:10px;padding:12px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;align-items:flex-start;margin:7px 0}
.event-color{width:4px;min-width:4px;align-self:stretch;border-radius:5px}
.event-content{flex:1;min-width:0}.event-content b{overflow-wrap:anywhere}
.event-actions{display:flex;gap:5px}.event-actions button{padding:6px 9px;font-size:12px}
.agenda-date{font-size:12px;color:var(--red);font-weight:900;margin:18px 0 8px}
.time-grid{overflow:auto;max-height:650px;border:1px solid var(--line);border-radius:13px;background:var(--panel)}
.time-grid-inner{position:relative;min-width:520px}
.time-row{display:grid;grid-template-columns:58px 1fr;min-height:58px;border-bottom:1px solid var(--line)}
.time-label{font-size:10px;color:var(--muted);padding:5px;text-align:center}
.time-slot{position:relative;border-left:1px solid var(--line)}
.time-event{position:absolute;left:64px;right:5px;top:3px;border-radius:7px;padding:6px 8px;font-size:11px;overflow:hidden;z-index:2;border-left:3px solid var(--blue);cursor:pointer}
.note-card{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:17px 48px 17px 16px;min-height:100px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}
.note-edit{position:absolute;top:9px;right:9px;width:34px;height:34px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:17px}
.color-options{display:flex;gap:9px;flex-wrap:wrap}
.color-choice{width:28px;height:28px;border-radius:50%;border:3px solid transparent;padding:0}
.color-choice.active{outline:2px solid var(--ink);outline-offset:2px}

/* REDLINE 2.3 */
#screen{animation:screenIn .28s ease both}
@keyframes screenIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.primary,.secondary,.danger,.nav button,.icon-btn{ -webkit-tap-highlight-color:transparent}
.primary:active,.secondary:active,.danger:active,.nav button:active{transform:scale(.95)}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:14px 0;border-bottom:1px solid var(--line)}
.setting-row:last-child{border:0}
.setting-row b{display:block}
.setting-row .muted{margin-top:4px}
.setting-switch{width:48px;height:27px;accent-color:var(--red)}
.quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.quick-action{min-height:100px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left}
.quick-action span{font-size:22px}
.profile-mark{width:54px;height:54px;border-radius:17px;background:linear-gradient(135deg,var(--red),#7e263f);display:grid;place-items:center;font-weight:950;font-size:22px;color:white}
@media(max-width:600px){
 .app{padding:13px}.month-cell{min-height:70px;padding:5px 3px}
 .event-dot{font-size:9px;padding:2px 3px}
 .view-switch button{padding:8px 7px;font-size:11px}
 .calendar-toolbar{gap:6px}.calendar-toolbar h2{font-size:16px}
 .level-pill{font-size:10px;padding:8px 10px}
 .quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(min-width:800px){
 .app{padding:28px}
 .today-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:18px;align-items:start}
 .today-layout>.main-column,.today-layout>.side-column{min-width:0}
 .hero{padding:32px}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
body.reduce-motion *,body.reduce-motion *::before,body.reduce-motion *::after{animation:none!important;transition:none!important}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand">RED<span>LINE</span></div>
  <div class="top-actions">
    <button class="icon-btn" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle theme">☀</button>
    <div class="level-pill" id="levelPill">LEVEL 1 · 0 XP</div>
  </div>
</header>
<main id="screen"></main>
</div>
<nav class="nav"><div class="nav-inner" id="nav"></div></nav>
<div class="toast" id="toast"></div>

<div class="modal" id="taskModal"><div class="modal-box">
  <div class="section-head"><h2>New task</h2><button class="delete" onclick="closeTaskModal()">✕</button></div>
  <div class="field"><label>TASK NAME</label><input id="taskName" maxlength="100" placeholder="What needs to get done?"></div>
  <div class="field"><label>DATE</label><input id="taskDate" type="date"></div>
  <div class="field"><label>CATEGORY</label><select id="taskCat"></select></div>
  <div class="field"><label>PRIORITY</label><select id="taskPri"><option value="0">Normal</option><option value="1">Important</option><option value="2">High</option></select></div>
  <div class="field"><label>REPEAT</label><select id="taskRep"><option value="none">Does not repeat</option><option value="daily">Daily</option><option value="weekly">Weekly</option></select></div>
  <button class="primary block" onclick="addTask()">Add task</button>
</div></div>

<div class="modal" id="eventModal"><div class="modal-box">
  <div class="section-head"><h2 id="eventModalTitle">Create event</h2><button class="delete" onclick="closeEventModal()">✕</button></div>
  <input type="hidden" id="eventEditId">
  <div class="field"><label>EVENT TITLE</label><input id="eventName" maxlength="120" placeholder="Class, meeting, activity..."></div>
  <div class="grid"><div class="field"><label>START DATE</label><input id="eventDate" type="date"></div><div class="field"><label>END DATE</label><input id="eventEndDate" type="date"></div></div>
  <div class="grid"><div class="field"><label>START TIME</label><input id="eventTime" type="time"></div><div class="field"><label>END TIME</label><input id="eventEndTime" type="time"></div></div>
  <div class="field"><label>LOCATION</label><input id="eventLocation" maxlength="120" placeholder="Optional"></div>
  <div class="field"><label>DESCRIPTION</label><textarea id="eventDescription" placeholder="Add details..."></textarea></div>
  <div class="field"><label>CALENDAR</label><select id="eventCategory"><option>Personal</option><option>School</option><option>Work</option><option>Fitness</option><option>Other</option></select></div>
  <div class="field"><label>EVENT COLOUR</label><div class="color-options" id="eventColors"></div></div>
  <div class="field"><label>REPEAT</label><select id="eventRepeat"><option value="none">Does not repeat</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select></div>
  <button class="primary block" onclick="saveEvent()">Save event</button>
</div></div>

<script>
// ==========================================
// REDLINE 2.3 — CORE ENGINE
// ==========================================

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const todayKey=()=>dateKey(new Date());
const addDays=(key,n)=>{const d=fromKey(key);d.setDate(d.getDate()+n);return dateKey(d)};
const read=(key,fallback)=>{try{const v=localStorage.getItem('rl2-'+key);return v===null?fallback:JSON.parse(v)}catch(e){return fallback}};
const write=(key,value)=>{try{localStorage.setItem('rl2-'+key,JSON.stringify(value))}catch(e){console.warn('Storage write failed',e)}};

let tasks=read('tasks',[]),cats=read('cats',['Study','Personal','Fitness','Other']);
let focus=read('focus',{}),exams=read('exams',[]),notes=read('notes',{}),events=read('events',[]);
let xp=Number(read('xp',0))||0;
let xpAwards=read('xpAwards',{});
let challenges=read('challenges',[]),completedDays=read('completedDays',[]);
let weeklyGoal=Number(read('goal',20))||20;
let tab='today',selectedDate=todayKey(),calendarMonth=new Date(),calendarView='month';
let calendarSearch='',calendarFilter='All',selectedEventColor='#78aaff',editingNote=false;
let timerLength=1500,timerLeft=1500,timerEndAt=Number(read('timerEndAt',0))||0,timerId=null;
let timerRunning=timerEndAt>Date.now();
let currentQuote=read('quote',0);
let theme=read('theme','dark');
let profileName=read('profileName','Operator');
let reduceMotion=read('reduceMotion',false);

const NAV=[
 ['today','⌂','Home'],
 ['calendar','▦','Calendar'],
 ['focus','◷','Focus'],
 ['progress','▥','Progress'],
 ['more','◇','More'],
 ['settings','⚙','Settings']
];

const QUOTES=[
 'Discipline creates freedom.',
 'Small progress is still progress.',
 'Your future is built by what you do today.',
 'Focus on the process. Results will follow.',
 'Consistency beats motivation.',
 'Make your actions match your ambitions.',
 'One focused hour can change your day.',
 'Stop waiting. Start building.'
];

const COLORS=['#78aaff','#f04459','#55d6a2','#f4c16b','#b99cff','#ff8d57'];

function save(){
 write('tasks',tasks);write('cats',cats);write('focus',focus);
 write('exams',exams);write('notes',notes);write('events',events);
 write('xp',xp);write('xpAwards',xpAwards);
 write('challenges',challenges);write('completedDays',completedDays);
 write('goal',weeklyGoal);write('timerEndAt',timerEndAt);
 write('profileName',profileName);write('reduceMotion',reduceMotion);
}

function toast(message){
 const el=$('toast');
 if(!el)return;
 el.textContent=message;
 el.classList.add('show');
 clearTimeout(window.toastTimeout);
 window.toastTimeout=setTimeout(()=>el.classList.remove('show'),2300);
}

function level(){return Math.floor(xp/100)+1}
function levelProgress(){return xp%100}

function awardXP(amount){
 xp+=amount;
 save();
 toast(`+${amount} XP earned`);
}

function escapeHTML(value){
 return String(value??'').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 })[c]);
}

function formatDate(key){
 return fromKey(key).toLocaleDateString('en-IN',{
  weekday:'short',day:'numeric',month:'short'
 });
}

function shortDate(key){
 return fromKey(key).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
}

function isSameDay(a,b){return a===b}

function applyTheme(){
 document.documentElement.dataset.theme=theme;
 $('themeToggle').textContent=theme==='dark'?'☀':'☾';
}

function toggleTheme(){
 theme=theme==='dark'?'light':'dark';
 write('theme',theme);
 applyTheme();
}

function go(next){
 tab=next;
 render();
 window.scrollTo({top:0,behavior:reduceMotion?'auto':'smooth'});
}

function renderNav(){
 $('nav').innerHTML=NAV.map(n=>`
  <button class="${tab===n[0]?'active':''}" onclick="go('${n[0]}')">
   <span>${n[1]}</span>${n[2]}
  </button>
 `).join('');
}

function render(){
 renderNav();
 $('levelPill').textContent=`LEVEL ${level()} · ${xp} XP`;
 const screens={
  today:renderToday,
  calendar:renderCalendar,
  focus:renderFocus,
  progress:renderStats,
  more:renderMore,
  settings:renderSettings
 };
 (screens[tab]||renderToday)();
}

function completedTasks(){
 return tasks.filter(t=>t.done).length;
}

function tasksForDate(key){
 return tasks.filter(t=>t.date===key);
}

function getFocusMinutes(key){
 return Number(focus[key]||0);
}

function ring(percent,label){
 const safe=Math.max(0,Math.min(100,percent));
 return `
 <div style="width:90px;height:90px;border-radius:50%;background:conic-gradient(var(--red) ${safe*3.6}deg,var(--panel2) 0);display:grid;place-items:center;flex-shrink:0">
  <div style="width:72px;height:72px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:16px;font-weight:900">${label}</div>
 </div>`;
}

function renderToday(){
 const today=todayKey();
 const todays=tasksForDate(today);
 const done=todays.filter(t=>t.done).length;
 const total=todays.length;
 const percent=total?Math.round(done/total*100):0;
 const mins=getFocusMinutes(today);
 const hours=Math.floor(mins/60),remaining=mins%60;

 const week=[];
 const start=new Date();
 start.setDate(start.getDate()-start.getDay());
 for(let i=0;i<7;i++){
  const x=new Date(start);
  x.setDate(start.getDate()+i);
  week.push(x);
 }

function ensureRecurringSchedule(){
 const originals=tasks.filter(t=>t.repeat&&t.repeat!=='none'&&!t.generated);
 originals.forEach(original=>{
  for(let i=1;i<=30;i++){
   const date=addDays(original.date,i);
   const d=fromKey(date);
   const matches=original.repeat==='daily'||
    (original.repeat==='weekly'&&d.getDay()===fromKey(original.date).getDay());

   if(!matches)continue;

   const exists=tasks.some(t=>
    t.generatedFrom===original.id&&t.date===date
   );

   if(!exists){
    tasks.push({
     ...original,
     id:original.id+'-'+date,
     date,
     done:false,
     generated:true,
     generatedFrom:original.id
    });
   }
  }
 });
}

function timerText(){

function setTimer(minutes){

function startTimer(){
 if(timerRunning)return;

 if(timerLeft<=0)timerLeft=timerLength;

 timerRunning=true;
 timerEndAt=Date.now()+timerLeft*1000;
 save();

 timerId=setInterval(updateTimer,1000);
 renderFocus();
}

function pauseTimer(){
 if(!timerRunning)return;

 timerRunning=false;
 clearInterval(timerId);
 timerId=null;
 timerLeft=Math.max(0,Math.ceil((timerEndAt-Date.now())/1000));
 timerEndAt=0;
 save();
 renderFocus();
}

function resetTimer(){
 clearInterval(timerId);
 timerId=null;
 timerRunning=false;
 timerEndAt=0;
 timerLeft=timerLength;
 save();
 renderFocus();
}

function updateTimer(){
 if(!timerRunning)return;

 timerLeft=Math.max(0,Math.ceil((timerEndAt-Date.now())/1000));

 const display=$('screen')?.querySelector('.timer');
 if(display)display.textContent=timerText();

 if(timerLeft<=0){
  clearInterval(timerId);
  timerId=null;
  timerRunning=false;
  timerEndAt=0;

  const key=todayKey();
  focus[key]=(Number(focus[key])||0)+timerLength;
  awardXP(25);
  timerLeft=timerLength;
  save();

  toast('Focus session completed! +25 XP');
  render();
 }
}

// SETTINGS

function renderSettings(){
 $('screen').innerHTML=`
 <div class="page-heading">
  <div class="eyebrow">PERSONALISE YOUR WORKSPACE</div>
  <h1>Settings<span style="color:var(--red)">.</span></h1>
  <p class="muted">Configure your Redline experience.</p>
 </div>

 <section class="card">
  <div class="eyebrow">PROFILE</div>
  <h2>Your identity</h2>
  <div class="field">
   <label>DISPLAY NAME</label>
   <input id="profileNameInput" maxlength="30" value="${escapeHTML(profileName)}" placeholder="Enter your name">
  </div>
  <button class="primary block" onclick="saveProfile()">Save profile</button>
 </section>

 <section class="card">
  <div class="eyebrow">APPEARANCE</div>
  <h2>Theme</h2>
  <p class="muted">Choose your preferred appearance.</p>
  <div class="theme-options">
   <button class="theme-option ${theme==='dark'?'active':''}" onclick="setTheme('dark')">
    <span class="theme-preview dark-preview"></span>
    <b>Midnight</b>
    <small>Dark mode</small>
   </button>
   <button class="theme-option ${theme==='light'?'active':''}" onclick="setTheme('light')">
    <span class="theme-preview light-preview"></span>
    <b>Light</b>
    <small>Light mode</small>
   </button>
  </div>
 </section>

 <section class="card">
  <div class="eyebrow">PREFERENCES</div>
  <h2>App behaviour</h2>
  <div class="setting-row">
   <div>
    <b>Reduced motion</b>
    <p class="muted">Reduce interface animations.</p>
   </div>
   <input type="checkbox" id="motionToggle" ${reduceMotion?'checked':''} onchange="setReducedMotion(this.checked)">
  </div>
 </section>

 <section class="card">
  <div class="eyebrow">GOALS</div>
  <h2>Weekly focus target</h2>
  <p class="muted">Set a realistic weekly focus target in hours.</p>
  <div class="field">
   <label>HOURS PER WEEK</label>
   <input id="weeklyGoalInput" type="number" min="1" max="168" value="${weeklyGoal}">
  </div>
  <button class="primary block" onclick="saveGoal()">Save goal</button>
 </section>

 <section class="card">
  <div class="eyebrow">DATA MANAGEMENT</div>
  <h2>Backup & restore</h2>
  <p class="muted">Keep a backup of your tasks, events, notes and progress.</p>
  <button class="secondary block" onclick="exportData()">↓ Export backup</button>
  <div class="field">
   <label>RESTORE FROM BACKUP</label>
   <input type="file" accept=".json,application/json" onchange="importData(this)">
  </div>
  <p class="small muted">Restoring a backup replaces your current Redline data.</p>
 </section>

 <section class="card">
  <div class="eyebrow">ABOUT</div>
  <h2>Redline 2.3</h2>
  <p class="muted">A personal command centre for planning, focus and progress.</p>
  <p class="small muted">Midnight Blue · Crimson Edition</p>
 </section>`;
}

function saveProfile(){
 const value=$('profileNameInput').value.trim();
 profileName=value||'Operator';
 save();
 renderSettings();
 toast('Profile updated');
}

function setTheme(value){
 theme=value;
 write('theme',theme);
 applyTheme();
 renderSettings();
}

function setReducedMotion(value){
 reduceMotion=Boolean(value);
 write('reduceMotion',reduceMotion);
 document.documentElement.classList.toggle('reduce-motion',reduceMotion);
 toast('Preference updated');
}

function saveGoal(){
 const value=Number($('weeklyGoalInput').value);

 if(!Number.isFinite(value)||value<1||value>168){
  toast('Enter a goal between 1 and 168 hours');
  return;
 }

 weeklyGoal=value;
 save();
 renderSettings();
 toast('Weekly goal updated');
}

// BACKUP & RESTORE

function exportData(){
 const data={
  tasks,cats,focus,exams,notes,events,xp,xpAwards,
  challenges,completedDays,weeklyGoal,profileName,theme,reduceMotion
 };

 const blob=new Blob([JSON.stringify(data,null,2)],{
  type:'application/json'
 });

 const url=URL.createObjectURL(blob);
 const link=document.createElement('a');
 link.href=url;
 link.download='redline-backup.json';
 link.click();

 setTimeout(()=>URL.revokeObjectURL(url),1000);
 toast('Backup exported');
}

function importData(input){
 const file=input.files?.[0];
 if(!file)return;

 if(!confirm('Restore this backup? Your current data will be replaced.')){
  input.value='';
  return;
 }

 const reader=new FileReader();

 reader.onload=()=>{
  try{
   const data=JSON.parse(reader.result);

   if(!data||typeof data!=='object')throw new Error('Invalid backup');

   tasks=Array.isArray(data.tasks)?data.tasks:[];
   cats=Array.isArray(data.cats)?data.cats:cats;
   focus=data.focus||{};
   exams=Array.isArray(data.exams)?data.exams:[];
   notes=data.notes||{};
   events=Array.isArray(data.events)?data.events:[];
   xp=Number(data.xp)||0;
   xpAwards=data.xpAwards||{};
   challenges=Array.isArray(data.challenges)?data.challenges:[];
   completedDays=Array.isArray(data.completedDays)?data.completedDays:[];
   weeklyGoal=Number(data.weeklyGoal)||20;
   profileName=data.profileName||'Operator';
   theme=data.theme||'dark';
   reduceMotion=Boolean(data.reduceMotion);

   migrateData();
   ensureRecurringSchedule();
   save();
   applyTheme();
   render();

   toast('Backup restored successfully');
  }catch(error){
   toast('Invalid backup file');
  }
 };

 reader.readAsText(file);
}

// STARTUP

function initialise(){
 migrateData();

 if(!Array.isArray(tasks))tasks=[];
 if(!Array.isArray(events))events=[];
 if(!Array.isArray(exams))exams=[];
 if(!Array.isArray(completedDays))completedDays=[];
 if(!Array.isArray(cats)||!cats.length){
  cats=['Study','Personal','Fitness','Other'];
 }

 applyTheme();
 document.documentElement.classList.toggle('reduce-motion',reduceMotion);

 ensureRecurringSchedule();
 save();

 if(timerRunning){
  timerLeft=Math.max(0,Math.ceil((timerEndAt-Date.now())/1000));

  if(timerLeft<=0){
   timerRunning=false;
   timerEndAt=0;
   timerLeft=timerLength;
   save();
  }else{
   timerId=setInterval(updateTimer,1000);
  }
 }

 document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&timerRunning)updateTimer();
 });

 window.addEventListener('pageshow',()=>{
  if(timerRunning)updateTimer();
 });
}

initialise();
render();
</script>
</body>
</html>
