<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<meta name="description" content="Redline — build your momentum.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Redline 2.1</title>

<style>
:root{
  color-scheme:dark;
  --bg:#101114;
  --panel:#191b22;
  --panel2:#22252e;
  --line:#303440;
  --ink:#f5f5f7;
  --muted:#999eaa;
  --red:#ef4053;
  --green:#54d6a0;
  --amber:#f2bd62;
  --blue:#83aaff;
  --purple:#b69aff;
  --radius:18px;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:Inter,system-ui,-apple-system,sans-serif;
  padding-bottom:100px;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer;color:inherit}
.app{max-width:1100px;margin:auto;padding:18px}
.top{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 2px 22px;
}
.brand{font-size:23px;font-weight:900;letter-spacing:2px}
.brand span{color:var(--red)}
.level-pill{
  background:var(--panel2);border:1px solid var(--line);
  border-radius:30px;padding:8px 13px;font-size:12px;
}
.page-heading{margin:12px 0 22px}
.eyebrow{
  color:var(--red);font-size:10px;font-weight:800;
  letter-spacing:2px;text-transform:uppercase;
}
h1{font-size:34px;line-height:1.1;margin:9px 0}
h2{font-size:19px;margin:7px 0}
h3{margin:6px 0}
p{line-height:1.5}
.muted{color:var(--muted);font-size:13px}
.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:17px;margin:13px 0;
}
.hero{
  background:linear-gradient(135deg,#29202a,#191b22 65%);
  border:1px solid #49313a;border-radius:23px;
  padding:23px;margin-bottom:15px;
}
.hero h1{font-size:38px}
.hero h1 span{color:var(--red)}
.hero p{color:var(--muted)}
.grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.stat-card{margin:0;padding:15px}
.stat-number{font-size:28px;font-weight:850;margin:9px 0}
.stat-number small{font-size:12px;color:var(--muted)}
.primary,.secondary,.danger{
  border:0;border-radius:12px;padding:12px 16px;
  font-weight:750;transition:transform .15s,filter .15s;
}
.primary{background:var(--red);color:white}
.secondary{background:var(--panel2);border:1px solid var(--line)}
.danger{background:#48232a;color:#ffb3bc}
button:active{transform:scale(.96)}
.block{width:100%;margin-top:9px}
input,textarea,select{
  width:100%;padding:12px;border-radius:11px;
  border:1px solid var(--line);background:var(--panel2);
  color:var(--ink);outline:none;
}
textarea{resize:vertical;min-height:100px}
input:focus,textarea:focus,select:focus{border-color:var(--red)}
.field{margin:13px 0}
.field label{
  display:block;font-size:10px;letter-spacing:1.5px;
  color:var(--muted);font-weight:800;margin-bottom:7px;
}
.section-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin:22px 0 10px;
}
.task{
  display:flex;align-items:center;gap:11px;
  padding:13px 0;border-bottom:1px solid var(--line);
}
.task:last-child{border:0}
.task input[type=checkbox]{width:20px;height:20px;accent-color:var(--red)}
.task.done .task-name{text-decoration:line-through;color:var(--muted)}
.task-name{font-weight:650;flex:1;overflow-wrap:anywhere}
.task small{display:block;color:var(--muted);margin-top:4px}
.delete{
  border:0;background:transparent;color:var(--muted);
  font-size:20px;padding:5px 9px;
}
.progress-track{
  height:9px;background:var(--panel2);border-radius:20px;
  overflow:hidden;margin:12px 0;
}
.progress-track i{
  display:block;height:100%;background:var(--red);
  border-radius:20px;transition:width .3s;
}
.date-strip{display:flex;gap:7px;overflow-x:auto;padding:5px 0 15px}
.date-btn{
  min-width:49px;padding:9px 5px;background:var(--panel);
  border:1px solid var(--line);border-radius:13px;
  display:flex;flex-direction:column;align-items:center;gap:5px;
}
.date-btn span{font-size:10px;color:var(--muted)}
.date-btn.active{border-color:var(--red);background:#382029}
.date-btn b{font-size:17px}
.date-btn i{font-size:10px;color:var(--green)}
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:10;
  background:#15161bf2;border-top:1px solid var(--line);
  padding:9px 5px calc(9px + env(safe-area-inset-bottom));
  backdrop-filter:blur(15px);
}
.nav-inner{
  max-width:1100px;margin:auto;display:flex;
  justify-content:space-around;gap:3px;
}
.nav button{
  flex:1;border:0;background:transparent;color:var(--muted);
  padding:9px 2px;border-radius:12px;font-size:10px;
}
.nav button.active{color:white;background:var(--panel2)}
.nav button span{display:block;font-size:19px;margin-bottom:4px}
.timer{font-size:55px;font-weight:850;letter-spacing:2px;text-align:center;margin:20px 0}
.timer-ring{
  width:220px;height:220px;border:8px solid var(--panel2);
  border-radius:50%;display:flex;align-items:center;
  justify-content:center;margin:20px auto;
}
.center{text-align:center}
.quote{font-size:19px;font-weight:700;line-height:1.5;padding:15px 0}
.chart{display:flex;align-items:flex-end;gap:7px;height:150px;padding:15px 0 0}
.bar-col{
  flex:1;height:100%;display:flex;flex-direction:column;
  justify-content:flex-end;align-items:center;gap:6px;min-width:0;
}
.bar-col i{
  width:70%;max-width:30px;background:var(--red);
  border-radius:6px 6px 2px 2px;min-height:2px;
}
.bar-col span{font-size:9px;color:var(--muted)}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.calendar-day{
  min-height:48px;border:1px solid var(--line);
  border-radius:9px;background:var(--panel2);
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;font-size:12px;min-width:0;
}
.calendar-day.today{border-color:var(--red)}
.calendar-day.marked{background:#263b35;border-color:var(--green)}
.badge{
  border:1px solid var(--line);background:var(--panel2);
  padding:12px;border-radius:13px;margin:5px 0;
}
.badge.unlocked{border-color:#8a7040}
.badge.locked{opacity:.5}
.shop-item{
  display:flex;align-items:center;gap:12px;
  padding:13px 0;border-bottom:1px solid var(--line);
}
.shop-item .emoji{font-size:27px}
.shop-item .details{flex:1}
.toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  background:#30333d;color:white;padding:12px 18px;
  border-radius:12px;z-index:30;font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.toast.show{opacity:1}
.modal{
  display:none;position:fixed;inset:0;background:#000b;
  z-index:20;align-items:center;justify-content:center;padding:18px;
}
.modal.show{display:flex}
.modal-box{
  width:100%;max-width:500px;background:var(--panel);
  border:1px solid var(--line);border-radius:20px;padding:20px;
  max-height:90vh;overflow:auto;
}
.empty{text-align:center;padding:25px 10px;color:var(--muted)}
.small{font-size:11px}

/* CALENDAR 2.1 */
.calendar-toolbar{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;flex-wrap:wrap;
}
.calendar-toolbar h2{flex:1;text-align:center}
.calendar-controls{display:flex;gap:6px;align-items:center}
.calendar-controls button{padding:9px 12px}
.view-switch{
  display:flex;gap:4px;background:var(--panel2);
  padding:4px;border-radius:12px;
}
.view-switch button{
  border:0;background:transparent;color:var(--muted);
  border-radius:9px;padding:8px 10px;font-size:12px;
}
.view-switch button.active{background:var(--red);color:white}
.cal-weekdays{
  display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
  gap:5px;margin-bottom:6px;
}
.cal-weekdays div{text-align:center;color:var(--muted);font-size:11px;padding:7px 0}
.month-grid{
  display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;
}
.month-cell{
  min-height:105px;padding:7px 5px;border:1px solid var(--line);
  border-radius:10px;background:var(--panel2);text-align:left;
  display:flex;flex-direction:column;gap:4px;overflow:hidden;
}
.month-cell.outside{opacity:.35}
.month-cell.selected{border:1px solid var(--red);background:#30212a}
.month-cell.today .day-number{color:var(--red);font-weight:900}
.day-number{font-size:12px}
.event-dot{
  font-size:10px;padding:3px 5px;border-radius:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:#34415a;color:#dce7ff;
}
.event-dot.task-dot{background:#263b35;color:#b6f3d8}
.event-dot.exam-dot{background:#4b3821;color:#ffdfa5}
.calendar-day-list{display:flex;flex-direction:column;gap:8px}
.event-card{
  display:flex;gap:10px;padding:12px;border:1px solid var(--line);
  background:var(--panel2);border-radius:12px;align-items:flex-start;
}
.event-color{width:4px;min-width:4px;align-self:stretch;border-radius:5px}
.event-content{flex:1;min-width:0}
.event-content b{overflow-wrap:anywhere}
.event-actions{display:flex;gap:5px}
.event-actions button{padding:6px 9px;font-size:12px}
.agenda-date{font-size:12px;color:var(--red);font-weight:800;margin:18px 0 8px}
.time-grid{
  overflow:auto;max-height:650px;border:1px solid var(--line);
  border-radius:13px;background:var(--panel);
}
.time-grid-inner{position:relative;min-width:520px}
.time-row{
  display:grid;grid-template-columns:58px 1fr;
  min-height:58px;border-bottom:1px solid var(--line);
}
.time-label{font-size:10px;color:var(--muted);padding:5px;text-align:center}
.time-slot{position:relative;border-left:1px solid var(--line)}
.time-event{
  position:absolute;left:5px;right:5px;top:3px;
  border-radius:7px;padding:6px 8px;font-size:11px;
  overflow:hidden;z-index:2;border-left:3px solid var(--blue);
}
.note-card{
  position:relative;background:#29252a;border:1px solid #51404a;
  border-radius:14px;padding:17px 48px 17px 16px;
  min-height:100px;white-space:pre-wrap;overflow-wrap:anywhere;
  line-height:1.65;
}
.note-edit{
  position:absolute;top:9px;right:9px;width:34px;height:34px;
  border:1px solid var(--line);border-radius:10px;
  background:var(--panel2);font-size:17px;
}
.color-options{display:flex;gap:9px;flex-wrap:wrap}
.color-choice{
  width:28px;height:28px;border-radius:50%;
  border:3px solid transparent;padding:0;
}
.color-choice.active{outline:2px solid white;outline-offset:2px}
@media(max-width:600px){
  .app{padding:13px}
  .month-cell{min-height:72px;padding:5px 3px}
  .event-dot{font-size:9px;padding:2px 3px}
  .view-switch button{padding:8px 7px;font-size:11px}
  .calendar-toolbar{gap:6px}
  .calendar-toolbar h2{font-size:16px}
}
@media(min-width:650px){
  .app{padding:25px}
  .hero{padding:30px}
  h1{font-size:40px}
}
</style>
</head>

<body>
<div class="app">
  <header class="top">
    <div class="brand">RED<span>LINE</span></div>
    <div class="level-pill" id="levelPill">LEVEL 1 · 0 XP</div>
  </header>
  <main id="screen"></main>
</div>

<nav class="nav">
  <div class="nav-inner" id="nav"></div>
</nav>

<div class="toast" id="toast"></div>

<!-- TASK MODAL -->
<div class="modal" id="taskModal">
  <div class="modal-box">
    <div class="section-head">
      <h2>New task</h2>
      <button class="delete" onclick="closeTaskModal()">✕</button>
    </div>
    <div class="field">
      <label>TASK NAME</label>
      <input id="taskName" maxlength="100" placeholder="What needs to get done?">
    </div>
    <div class="field">
      <label>DATE</label>
      <input id="taskDate" type="date">
    </div>
    <div class="field">
      <label>CATEGORY</label>
      <select id="taskCat"></select>
    </div>
    <div class="field">
      <label>PRIORITY</label>
      <select id="taskPri">
        <option value="0">Normal</option>
        <option value="1">Important</option>
        <option value="2">High</option>
      </select>
    </div>
    <div class="field">
      <label>REPEAT</label>
      <select id="taskRep">
        <option value="none">Does not repeat</option>
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
      </select>
    </div>
    <button class="primary block" onclick="addTask()">Add task</button>
  </div>
</div>

<!-- EVENT MODAL -->
<div class="modal" id="eventModal">
  <div class="modal-box">
    <div class="section-head">
      <h2 id="eventModalTitle">Create event</h2>
      <button class="delete" onclick="closeEventModal()">✕</button>
    </div>
    <input type="hidden" id="eventEditId">
    <div class="field">
      <label>EVENT TITLE</label>
      <input id="eventName" maxlength="120" placeholder="Class, meeting, activity...">
    </div>
    <div class="grid">
      <div class="field">
        <label>START DATE</label>
        <input id="eventDate" type="date">
      </div>
      <div class="field">
        <label>END DATE</label>
        <input id="eventEndDate" type="date">
      </div>
    </div>
    <div class="grid">
      <div class="field">
        <label>START TIME</label>
        <input id="eventTime" type="time">
      </div>
      <div class="field">
        <label>END TIME</label>
        <input id="eventEndTime" type="time">
      </div>
    </div>
    <div class="field">
      <label>LOCATION</label>
      <input id="eventLocation" maxlength="120" placeholder="Optional">
    </div>
    <div class="field">
      <label>DESCRIPTION</label>
      <textarea id="eventDescription" placeholder="Add details..."></textarea>
    </div>
    <div class="field">
      <label>CALENDAR</label>
      <select id="eventCategory">
        <option value="Personal">Personal</option>
        <option value="School">School</option>
        <option value="Work">Work</option>
        <option value="Fitness">Fitness</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="field">
      <label>EVENT COLOUR</label>
      <div class="color-options" id="eventColors"></div>
    </div>
    <div class="field">
      <label>REPEAT</label>
      <select id="eventRepeat">
        <option value="none">Does not repeat</option>
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
        <option value="monthly">Monthly</option>
        <option value="yearly">Yearly</option>
      </select>
    </div>
    <button class="primary block" onclick="saveEvent()">Save event</button>
  </div>
</div>

<script>
// ==========================================
// REDLINE 2.1 — CORE ENGINE
// ==========================================

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const todayKey=()=>dateKey(new Date());
const addDays=(key,n)=>{const d=fromKey(key);d.setDate(d.getDate()+n);return dateKey(d)};
const read=(key,fallback)=>{
  try{
    const value=localStorage.getItem('rl2-'+key);
    return value===null?fallback:JSON.parse(value);
  }catch(e){return fallback}
};
const write=(key,value)=>localStorage.setItem('rl2-'+key,JSON.stringify(value));

let tasks=read('tasks',[]);
let cats=read('cats',['Study','Personal','Fitness','Other']);
let focus=read('focus',{});
let exams=read('exams',[]);
let notes=read('notes',{});
let events=read('events',[]);
let xp=Number(read('xp',0))||0;
let coins=Number(read('coins',0))||0;
let xpAwards=read('xpAwards',{});
let owned=read('owned',['default']);
let avatar=read('avatar','default');
let challenges=read('challenges',[]);
let completedDays=read('completedDays',[]);
let weeklyGoal=Number(read('goal',20))||20;

let tab='today';
let selectedDate=todayKey();
let statsRange='Week';
let calendarMonth=new Date();
let calendarView='month';
let calendarSearch='';
let calendarFilter='All';
let selectedEventColor='#83aaff';
let editingNote=false;

let timerLength=25*60;
let timerLeft=25*60;
let timerEndAt=Number(read('timerEndAt',0))||0;
let timerId=null;
let timerRunning=timerEndAt>Date.now();

const NAV=[
  ['today','☀️','Today'],
  ['calendar','🗓️','Calendar'],
  ['focus','⏱️','Focus'],
  ['progress','📊','Progress'],
  ['more','☰','More']
];

const COLORS=[
  '#83aaff','#54d6a0','#ef4053','#f2bd62',
  '#b69aff','#ff91c8','#69d8dc','#b2b6c2'
];

const QUOTES=[
  'Discipline beats motivation.',
  'Small steps. Serious results.',
  'You do not need to be perfect. You need to be consistent.',
  'Your future is built by what you do today.',
  'Start before you feel ready.',
  'One focused hour can change your day.',
  'Stop waiting. Start doing.',
  'Make your actions match your ambitions.',
  'Consistency creates confidence.',
  'Do the work. Let the results speak.',
  'Progress is still progress, no matter how small.',
  'Your only competition is who you were yesterday.',
  'A little every day adds up.',
  'Stay patient. Stay disciplined.',
  'You can restart as many times as you need.',
  'Make today count.',
  'Focus on the next step, not the whole staircase.',
  'Hard work is a habit, not a mood.',
  'Build a life you are proud of.',
  'Less excuses. More execution.'
];

const SHOP=[
  {id:'default',name:'Classic',emoji:'⚡',price:0},
  {id:'fire',name:'Flame',emoji:'🔥',price:100},
  {id:'crown',name:'Royal',emoji:'👑',price:150},
  {id:'robot',name:'Robot',emoji:'🤖',price:200},
  {id:'diamond',name:'Diamond',emoji:'💎',price:250},
  {id:'ninja',name:'Ninja',emoji:'🥷',price:300},
  {id:'star',name:'Star',emoji:'⭐',price:350},
  {id:'ghost',name:'Ghost',emoji:'👻',price:400}
];

function save(){
  write('tasks',tasks);
  write('cats',cats);
  write('focus',focus);
  write('exams',exams);
  write('notes',notes);
  write('events',events);
  write('xp',xp);
  write('coins',coins);
  write('xpAwards',xpAwards);
  write('owned',owned);
  write('avatar',avatar);
  write('challenges',challenges);
  write('completedDays',completedDays);
  write('goal',weeklyGoal);
  write('timerEndAt',timerEndAt);
}

function escapeHTML(value){
  return String(value??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function toast(message){
  const el=$('toast');
  el.textContent=message;
  el.classList.add('show');
  clearTimeout(window.toastTimeout);
  window.toastTimeout=setTimeout(()=>el.classList.remove('show'),2300);
}

function level(){
  return Math.floor(xp/100)+1;
}
function levelXP(){
  return xp%100;
}
function awardXP(amount){
  xp+=amount;
  coins+=Math.max(1,Math.floor(amount/5));
  save();
  toast(`+${amount} XP · Coins earned!`);
}
function completedCount(){
  return tasks.filter(t=>t.done).length;
}
function dayTasks(key){
  return tasks.filter(t=>t.date===key);
}
function streak(){
  let count=0;
  let d=new Date();
  if(!completedDays.includes(dateKey(d)))d.setDate(d.getDate()-1);
  while(completedDays.includes(dateKey(d))){
    count++;
    d.setDate(d.getDate()-1);
  }
  return count;
}
function formatDate(key,options={weekday:'short',month:'short',day:'numeric'}){
  return fromKey(key).toLocaleDateString('en-IN',options);
}
function formatTime(time){
  if(!time)return '';
  const [h,m]=time.split(':').map(Number);
  return new Date(2000,0,1,h,m).toLocaleTimeString('en-IN',{
    hour:'numeric',minute:'2-digit'
  });
}
function go(next){
  tab=next;
  render();
}
function chooseDate(key){
  selectedDate=key;
  editingNote=false;
  render();
}

// ==========================================
// TASKS
// ==========================================

function openTaskModal(){
  $('taskModal').classList.add('show');
  $('taskDate').value=selectedDate;
  $('taskCat').innerHTML=cats.map(c=>
    `<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`
  ).join('');
  $('taskName').value='';
  $('taskPri').value='0';
  $('taskRep').value='none';
}
function closeTaskModal(){
  $('taskModal').classList.remove('show');
}

function ensureRecurringSchedule(){
  const roots=tasks.filter(t=>t.rep&&t.rep!=='none'&&!t.generated);
  roots.forEach(root=>{
    if(!root.seriesId)root.seriesId=root.id;
    const start=fromKey(root.date);
    const end=new Date(start.getFullYear(),11,31);
    for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
      const diff=Math.round((d-start)/86400000);
      const matches=root.rep==='daily'||
        (root.rep==='weekly'&&diff%7===0);
      if(!matches||diff===0)continue;
      const key=dateKey(d);
      const exists=tasks.some(t=>
        t.seriesId===root.seriesId&&t.date===key
      );
      if(!exists){
        tasks.push({
          ...root,
          id:Date.now()+Math.random(),
          date:key,
          done:false,
          generated:true
        });
      }
    }
  });
}

function addTask(){
  const text=$('taskName').value.trim();
  const date=$('taskDate').value;
  if(!text||!date){toast('Enter a task and date');return}
  const task={
    id:Date.now()+Math.random(),
    text,
    date,
    cat:$('taskCat').value,
    pri:Number($('taskPri').value),
    rep:$('taskRep').value,
    done:false,
    generated:false,
    seriesId:null
  };
  if(task.rep!=='none')task.seriesId=task.id;
  tasks.push(task);
  ensureRecurringSchedule();
  save();
  closeTaskModal();
  render();
  toast('Task added');
}

function toggleTask(id){
  const task=tasks.find(t=>t.id==id);
  if(!task)return;
  task.done=!task.done;
  if(task.done){
    const awardKey=String(task.id);
    if(!xpAwards[awardKey]){
      xpAwards[awardKey]=true;
      awardXP(10);
    }
  }
  const todays=dayTasks(todayKey());
  if(todays.length&&todays.every(t=>t.done)){
    if(!completedDays.includes(todayKey())){
      completedDays.push(todayKey());
      awardXP(20);
      toast('Perfect day! +20 XP');
    }
  }
  save();
  render();
}

function deleteTask(id){
  const task=tasks.find(t=>t.id==id);
  if(!task)return;
  if(task.seriesId){
    tasks=tasks.filter(t=>t.seriesId!==task.seriesId);
  }else{
    tasks=tasks.filter(t=>t.id!=id);
  }
  save();
  render();
  toast('Task deleted');
}

// ==========================================

function updateTimer(){
  if(timerRunning){
    timerLeft=Math.max(0,Math.ceil((timerEndAt-Date.now())/1000));
    if(timerLeft<=0){
      timerRunning=false;
      timerEndAt=0;
      const key=todayKey();
      focus[key]=(focus[key]||0)+timerLength;
      awardXP(25);
      save();
      clearInterval(timerId);
      timerId=null;
      toast('Focus session complete!');
    }
  }
  if(tab==='focus')renderFocus();
}

function startTimer(){
  if(timerRunning)return;
  timerEndAt=Date.now()+timerLeft*1000;
  timerRunning=true;
  save();
  clearInterval(timerId);
  timerId=setInterval(updateTimer,1000);
  render();
}
function pauseTimer(){
  if(!timerRunning)return;
  timerLeft=Math.max(0,Math.ceil((timerEndAt-Date.now())/1000));
  timerRunning=false;
  timerEndAt=0;
  clearInterval(timerId);
  timerId=null;
  save();
  render();
}
function resetTimer(){
  timerRunning=false;
  timerEndAt=0;
  timerLeft=timerLength;
  clearInterval(timerId);
  timerId=null;
  save();
  render();
}
function setTimer(minutes){
  if(timerRunning)return;
  timerLength=minutes*60;
  timerLeft=timerLength;
  render();
}
function timerText(){
  return `${pad(Math.floor(timerLeft/60))}:${pad(timerLeft%60)}`;
}
function totalFocus(key){
  return Math.floor((focus[key]||0)/60);
}

// ==========================================

function setCalendarView(view){
  calendarView=view;
  render();
}
function changeCalendar(amount){
  if(calendarView==='month'){
    calendarMonth.setMonth(calendarMonth.getMonth()+amount);
  }else{
    selectedDate=addDays(selectedDate,amount*(calendarView==='week'?7:1));
    calendarMonth=fromKey(selectedDate);
  }
  render();
}
function calendarToday(){
  selectedDate=todayKey();
  calendarMonth=new Date();
  render();
}
function setCalendarFilter(value){
  calendarFilter=value;
  render();
}
function setCalendarSearch(value){
  calendarSearch=value;
  render();
}

function eventMatchesDate(event,key){
  if(key<event.date)return false;
  const repeat=event.repeat||'none';
  if(repeat==='none')return key===event.date;
  if(event.repeatUntil&&key>event.repeatUntil)return false;
  const start=fromKey(event.date);
  const current=fromKey(key);
  if(repeat==='daily')return true;
  if(repeat==='weekly')return Math.round((current-start)/86400000)%7===0;
  if(repeat==='monthly')return current.getDate()===start.getDate();
  if(repeat==='yearly')return current.getMonth()===start.getMonth()&&current.getDate()===start.getDate();
  return false;
}

function eventsOn(key){
  return events.filter(e=>eventMatchesDate(e,key))
    .filter(e=>calendarFilter==='All'||e.category===calendarFilter)
    .filter(e=>!calendarSearch||
      (e.name+' '+(e.location||'')+' '+(e.description||''))
      .toLowerCase().includes(calendarSearch.toLowerCase()));
}

function openEventModal(id=null){
  const event=id?events.find(e=>e.id==id):null;
  $('eventModalTitle').textContent=event?'Edit event':'Create event';
  $('eventEditId').value=event?event.id:'';
  $('eventName').value=event?.name||'';
  $('eventDate').value=event?.date||selectedDate;
  $('eventEndDate').value=event?.endDate||event?.date||selectedDate;
  $('eventTime').value=event?.time||'09:00';
  $('eventEndTime').value=event?.endTime||'10:00';
  $('eventLocation').value=event?.location||'';
  $('eventDescription').value=event?.description||'';
  $('eventCategory').value=event?.category||'Personal';
  $('eventRepeat').value=event?.repeat||'none';
  selectedEventColor=event?.color||COLORS[0];
  $('eventColors').innerHTML=COLORS.map(c=>
    `<button type="button" class="color-choice ${c===selectedEventColor?'active':''}" style="background:${c}" onclick="chooseEventColor('${c}',this)"></button>`
  ).join('');
  $('eventModal').classList.add('show');
}
function chooseEventColor(color,button){
  selectedEventColor=color;
  document.querySelectorAll('.color-choice').forEach(b=>b.classList.remove('active'));
  button.classList.add('active');
}
function closeEventModal(){
  $('eventModal').classList.remove('show');
}

function saveEvent(){
  const name=$('eventName').value.trim();
  const date=$('eventDate').value;
  const endDate=$('eventEndDate').value||date;
  const time=$('eventTime').value;
  const endTime=$('eventEndTime').value;
  if(!name||!date||!time||!endTime){
    toast('Fill in the title, date and times');return;
  }
  if(endDate<date||(endDate===date&&endTime<=time)){
    toast('End must be after start');return;
  }
  const id=$('eventEditId').value;
  const event={
    id:id?id:Number(Date.now()),
    name,date,endDate,time,endTime,
    location:$('eventLocation').value.trim(),
    description:$('eventDescription').value.trim(),
    category:$('eventCategory').value,
    color:selectedEventColor,
    repeat:$('eventRepeat').value
  };
  if(id){
    const index=events.findIndex(e=>e.id==id);
    if(index>=0)events[index]=event;
  }else events.push(event);
  save();
  closeEventModal();
  render();
  toast(id?'Event updated':'Event created');
}

function deleteEvent(id){
  events=events.filter(e=>e.id!=id);
  save();
  render();
  toast('Event deleted');
}

function moveEventDate(id,newDate){
  const event=events.find(e=>e.id==id);
  if(!event)return;
  const oldStart=fromKey(event.date);
  const oldEnd=fromKey(event.endDate||event.date);
  const duration=Math.round((oldEnd-oldStart)/86400000);
  event.date=newDate;
  event.endDate=addDays(newDate,duration);
  save();
  render();
  toast('Event rescheduled');
}

function eventConflicts(event){
  return events.some(other=>{
    if(other.id==event.id)return false;
    if(other.date!==event.date)return false;
    return event.time<other.endTime&&event.endTime>other.time;
  });
}

function allowDrop(event){
  event.preventDefault();
}
function dragEvent(event,id){
  event.dataTransfer.setData('text/plain',String(id));
}
function dropEvent(event,date){
  event.preventDefault();
  const id=event.dataTransfer.getData('text/plain');
  if(id)moveEventDate(id,date);
}

// ==========================================
// BACKUP AND RESTORE
// ==========================================

function exportData(){
  const data={
    tasks,cats,focus,exams,notes,events,xp,coins,
    xpAwards,owned,avatar,challenges,completedDays,weeklyGoal
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='redline-backup.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('Backup exported');
}

function importData(input){
  const file=input.files?.[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      tasks=data.tasks||[];
      cats=data.cats||cats;
      focus=data.focus||{};
      exams=data.exams||[];
      notes=data.notes||{};
      events=data.events||[];
      xp=data.xp||0;
      coins=data.coins||0;
      xpAwards=data.xpAwards||{};
      owned=data.owned||['default'];
      avatar=data.avatar||'default';
      challenges=data.challenges||[];
      completedDays=data.completedDays||[];
      weeklyGoal=data.weeklyGoal||20;
      ensureRecurringSchedule();
      save();
      render();
      toast('Backup restored');
    }catch(e){toast('Invalid backup file')}
  };
  reader.readAsText(file);
}

        </div>
      `).join(''):'<div class="empty">No events on this date.</div>'}
    </section>

    <div class="section-head"><h2>Exams & deadlines</h2></div>
    <section class="card">
      <div class="field">
        <label>EXAM OR DEADLINE</label>
        <input id="examName" placeholder="e.g. Mathematics exam">
      </div>
      <div class="field">
        <label>DATE</label>
        <input id="examDate" type="date">
      </div>
      <button class="secondary block" onclick="addExam()">Add deadline</button>
      ${exams.sort((a,b)=>a.date.localeCompare(b.date)).map(e=>{
        const days=Math.ceil((fromKey(e.date)-fromKey(todayKey()))/86400000);
        return `<div class="event-card">
          <div class="event-content">
            <b>🎓 ${escapeHTML(e.name)}</b>
            <div class="muted">${formatDate(e.date)} · ${days<0?'Passed':days===0?'Today':days+' days left'}</div>
          </div>
          <button class="delete" onclick="deleteExam('${e.id}')">×</button>
        </div>`;
      }).join('')}
    </section>
  `;
}

// ==========================================
// PROGRESS SCREEN
// ==========================================

function renderStats(){
  const today=fromKey(todayKey());
  let weekDone=0;
  let weekTotal=0;
  let weekFocus=0;
  const bars=[];

  for(let i=6;i>=0;i--){
    const d=new Date(today);
    d.setDate(today.getDate()-i);
    const key=dateKey(d);
    const day=dayTasks(key);
    const done=day.filter(t=>t.done).length;
    weekDone+=done;
    weekTotal+=day.length;
    weekFocus+=focus[key]||0;
    bars.push({
      label:d.toLocaleDateString('en-IN',{weekday:'short'}),
      value:focus[key]||0
    });
  }

  const max=Math.max(1,...bars.map(b=>b.value));
  const percent=Math.min(100,Math.round(weekFocus/(weeklyGoal*3600)*100));
  const completed=tasks.filter(t=>t.done).length;

  const last100=Array.from({length:100},(_,i)=>{
    const key=addDays(todayKey(),i-99);
    return `<div title="${key}" style="
      aspect-ratio:1;border-radius:4px;
      background:${completedDays.includes(key)?'var(--green)':'var(--panel2)'};
      border:1px solid var(--line)"></div>`;
  }).join('');

  $('screen').innerHTML=`
    <div class="page-heading">
      <div class="eyebrow">YOUR MOMENTUM</div>
      <h1>Progress.</h1>
      <p class="muted">Measure the work. Improve the system.</p>
    </div>

    <div class="grid">
      <section class="card stat-card">
        <div class="eyebrow">TASKS DONE</div>
        <div class="stat-number">${completed}</div>
        <div class="muted">All time</div>
      </section>
      <section class="card stat-card">
        <div class="eyebrow">STREAK</div>
        <div class="stat-number">${streak()} 🔥</div>
        <div class="muted">Consecutive days</div>
      </section>
      <section class="card stat-card">
        <div class="eyebrow">TOTAL XP</div>
        <div class="stat-number">${xp}</div>
        <div class="muted">Level ${level()}</div>
      </section>
      <section class="card stat-card">
        <div class="eyebrow">COINS</div>
        <div class="stat-number">${coins} 🪙</div>
        <div class="muted">Available balance</div>
      </section>
    </div>

    <section class="card">
      <div class="section-head">
        <h2>Weekly focus</h2>
        <b>${percent}%</b>
      </div>
      <div class="progress-track"><i style="width:${percent}%"></i></div>
      <p class="muted">${(weekFocus/3600).toFixed(1)} hours out of ${weeklyGoal} hours</p>
      <div class="chart">
        ${bars.map(b=>`
          <div class="bar-col">
            <i style="height:${Math.max(2,b.value/max*100)}%"></i>
            <span>${b.label}</span>
          </div>
        `).join('')}
      </div>
    </section>

    <section class="card">
      <h2>Last 100 days</h2>
      <p class="muted">Green = all tasks scheduled that day completed.</p>
      <div style="display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:15px">
        ${last100}
      </div>
    </section>

    <section class="card">
      <div class="eyebrow">LEVEL ${level()}</div>
      <h2>${levelXP()} / 100 XP</h2>
      <div class="progress-track"><i style="width:${levelXP()}%"></i></div>
      <p class="muted">Complete tasks and focus sessions to earn XP and coins.</p>
    </section>

    <section class="card">
      <h2>Weekly task completion</h2>
      <div class="stat-number">${weekDone} / ${weekTotal}</div>
      <p class="muted">Tasks completed this week.</p>
    </section>
  `;
}

// ACHIEVEMENTS

  {name:'First Step',desc:'Complete your first task',goal:1,check:()=>tasks.filter(t=>t.done).length},

function renderAchievements(){
  const html=ACHIEVEMENTS.map(a=>{

    return `
      <div class="badge ${done?'unlocked':'locked'}">
        <div class="section-head">
          <b>${done?'🏆':'🔒'} ${a.name}</b>
          <span class="small">${done?'Unlocked':percent+'%'}</span>

        <div class="muted">${a.desc}</div>
        <div class="progress-track"><i style="width:${percent}%"></i></div>
        <div class="small muted">${Math.min(value,a.goal)} / ${a.goal}</div>

  $('screen').innerHTML=`
    <div class="page-heading">
      <div class="eyebrow">EARN YOUR REWARDS</div>

      <p class="muted">Every milestone counts.</p>
    </div>

// ==========================================
// CHALLENGES
// ==========================================

const CHALLENGE_LIST=[
  {id:'seven',name:'7-Day Consistency',desc:'Complete at least one task every day for 7 days.',days:7},
  {id:'focus5',name:'Focus Builder',desc:'Complete five focus sessions.',days:5},
  {id:'tasks10',name:'Task Takedown',desc:'Complete 10 tasks.',days:10},
  {id:'planner',name:'Plan Ahead',desc:'Add five events to your calendar.',days:5},
  {id:'early',name:'Morning Momentum',desc:'Complete a task before noon for five days.',days:5},
  {id:'notes',name:'Daily Reflection',desc:'Write a note on five different days.',days:5}
];

function challengeProgress(c){
  if(c.id==='seven')return Math.min(7,streak());
  if(c.id==='focus5')return Math.min(5,Object.values(focus).filter(v=>v>=900).length);
  if(c.id==='tasks10')return Math.min(10,tasks.filter(t=>t.done).length);
  if(c.id==='planner')return Math.min(5,events.length);
  if(c.id==='notes')return Math.min(5,Object.keys(notes).length);
  return 0;
}

function renderChallenges(){
  $('screen').innerHTML=`
    <div class="page-heading">
      <div class="eyebrow">PUSH YOURSELF</div>
      <h1>Challenges.</h1>
      <p class="muted">Build useful habits at a sustainable pace.</p>
    </div>
    ${CHALLENGE_LIST.map(c=>{
      const value=challengeProgress(c);
      const done=value>=c.days;
      return `
        <section class="card">
          <div class="section-head">
            <h2>${escapeHTML(c.name)}</h2>
            <span class="small">${done?'Completed':'In progress'}</span>
          </div>
          <p class="muted">${escapeHTML(c.desc)}</p>
          <div class="progress-track"><i style="width:${Math.min(100,value/c.days*100)}%"></i></div>
          <div class="muted small">${value} / ${c.days}</div>
        </section>
      `;
    }).join('')}
  `;
}

// ==========================================
// STORE
// ==========================================

function renderStore(){
  $('screen').innerHTML=`
    <div class="page-heading">
      <div class="eyebrow">SPEND YOUR REWARDS</div>
      <h1>Store.</h1>
      <p class="muted">Unlock avatars using coins earned from progress.</p>
    </div>

    <section class="hero">
      <div class="eyebrow">YOUR BALANCE</div>
      <h1>${coins} 🪙</h1>
      <p>Keep completing tasks to earn more.</p>
    </section>

    ${SHOP.map(item=>{
      const isOwned=owned.includes(item.id);
      const isActive=avatar===item.id;
      return `
        <div class="shop-item">
          <div class="emoji">${item.emoji}</div>
          <div class="details">
            <b>${item.name}</b>
            <div class="muted">${item.price===0?'Free':item.price+' coins'}</div>
          </div>
          <button class="${isActive?'secondary':'primary'}"
            onclick="buyItem('${item.id}')">
            ${isActive?'Equipped':isOwned?'Equip': 'Buy'}
          </button>
        </div>
      `;
    }).join('')}
  `;
}

function buyItem(id){
  const item=SHOP.find(i=>i.id===id);
  if(!item)return;
  if(owned.includes(id)){
    avatar=id;
    save();
    renderStore();
    toast('Avatar equipped');
    return;
  }
  if(coins<item.price){
    toast('Not enough coins');
    return;
  }
  coins-=item.price;
  owned.push(id);
  avatar=id;
  save();
  renderStore();
  toast('New avatar unlocked!');
}

      <h2>Data & backup</h2>

      <button class="secondary block" onclick="exportData()">Export backup</button>

        <input type="file" accept=".json,application/json" onchange="importData(this)">
      </div>
    </section>

    <section class="card">
      <h2>About Redline</h2>
      <p class="muted">Redline helps you organise your tasks, focus sessions, events and progress.</p>
      <p class="muted small">Version 2.1 · Your data is stored locally on this device/browser.</p>
    </section>
  `;
}

function saveGoal(){
  const value=Number($('weeklyGoalInput').value);
  if(!Number.isFinite(value)||value<1||value>168){
    toast('Enter a goal between 1 and 168 hours');
    return;
  }
  weeklyGoal=value;
  save();
  renderMore();
  toast('Weekly goal updated');
}

// ==========================================
// INITIALISE
// ==========================================

function initialise(){
  if(!Array.isArray(tasks))tasks=[];
  if(!Array.isArray(events))events=[];
  if(!Array.isArray(exams))exams=[];
  if(!Array.isArray(completedDays))completedDays=[];
  if(!Array.isArray(cats)||!cats.length)cats=['Study','Personal','Fitness','Other'];

  ensureRecurringSchedule();
  save();

  if(timerRunning){
    timerLeft=Math.max(0,Math.ceil((timerEndAt-Date.now())/1000));
    if(timerLeft<=0){
      timerRunning=false;
      timerEndAt=0;
      timerLeft=timerLength;
      save();
    }else{
      timerId=setInterval(updateTimer,1000);
    }
  }

  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden&&timerRunning)updateTimer();
  });

  window.addEventListener('pageshow',()=>{
    if(timerRunning)updateTimer();
  });
}

initialise();
render();

</script>
