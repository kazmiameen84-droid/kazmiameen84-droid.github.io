<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<meta name="description" content="Redline — build your momentum.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Redline 2.0</title>

<style>
:root{
  color-scheme:dark;
  --bg:#101114;
  --panel:#191b22;
  --panel2:#22252e;
  --line:#303440;
  --ink:#f5f5f7;
  --muted:#999eaa;
  --red:#ef4053;
  --green:#54d6a0;
  --amber:#f2bd62;
  --blue:#83aaff;
  --radius:18px;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,system-ui,-apple-system,sans-serif;
  padding-bottom:100px;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer;color:inherit}
.app{max-width:850px;margin:auto;padding:18px}
.top{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 2px 22px;
}
.brand{font-size:23px;font-weight:900;letter-spacing:2px}
.brand span{color:var(--red)}
.level-pill{
  background:var(--panel2);border:1px solid var(--line);
  border-radius:30px;padding:8px 13px;font-size:12px;
}
.page-heading{margin:12px 0 22px}
.eyebrow{
  color:var(--red);font-size:10px;font-weight:800;
  letter-spacing:2px;text-transform:uppercase;
}
h1{font-size:34px;line-height:1.1;margin:9px 0}
h2{font-size:19px;margin:7px 0}
h3{margin:6px 0}
p{line-height:1.5}
.muted{color:var(--muted);font-size:13px}
.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:17px;margin:13px 0;
}
.hero{
  background:linear-gradient(135deg,#29202a,#191b22 65%);
  border:1px solid #49313a;border-radius:23px;
  padding:23px;margin-bottom:15px;
}
.hero h1{font-size:38px}
.hero h1 span{color:var(--red)}
.hero p{color:var(--muted)}
.grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.stat-card{margin:0;padding:15px}
.stat-number{font-size:28px;font-weight:850;margin:9px 0}
.stat-number small{font-size:12px;color:var(--muted)}
.primary,.secondary,.danger{
  border:0;border-radius:12px;padding:12px 16px;font-weight:750;
  transition:transform .15s,filter .15s;
}
.primary{background:var(--red);color:white}
.secondary{background:var(--panel2);border:1px solid var(--line)}
.danger{background:#48232a;color:#ffb3bc}
button:active{transform:scale(.96)}
.block{width:100%;margin-top:9px}
input,textarea,select{
  width:100%;padding:12px;border-radius:11px;
  border:1px solid var(--line);background:var(--panel2);
  color:var(--ink);outline:none;
}
textarea{resize:vertical;min-height:100px}
input:focus,textarea:focus,select:focus{
  border-color:var(--red);
}
.field{margin:13px 0}
.field label{
  display:block;font-size:10px;letter-spacing:1.5px;
  color:var(--muted);font-weight:800;margin-bottom:7px;
}
.section-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin:22px 0 10px;
}
.task{
  display:flex;align-items:center;gap:11px;
  padding:13px 0;border-bottom:1px solid var(--line);
}
.task:last-child{border:0}
.task input[type=checkbox]{width:20px;height:20px;accent-color:var(--red)}
.task.done .task-name{text-decoration:line-through;color:var(--muted)}
.task-name{font-weight:650;flex:1;overflow-wrap:anywhere}
.task small{display:block;color:var(--muted);margin-top:4px}
.delete{
  border:0;background:transparent;color:var(--muted);
  font-size:20px;padding:5px 9px;
}
.progress-track{
  height:9px;background:var(--panel2);border-radius:20px;
  overflow:hidden;margin:12px 0;
}
.progress-track i{
  display:block;height:100%;background:var(--red);
  border-radius:20px;transition:width .3s;
}
.date-strip{
  display:flex;gap:7px;overflow-x:auto;padding:5px 0 15px;
}
.date-btn{
  min-width:49px;padding:9px 5px;background:var(--panel);
  border:1px solid var(--line);border-radius:13px;
  display:flex;flex-direction:column;align-items:center;gap:5px;
}
.date-btn span{font-size:10px;color:var(--muted)}
.date-btn.active{border-color:var(--red);background:#382029}
.date-btn b{font-size:17px}
.date-btn i{font-size:10px;color:var(--green)}
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:10;
  background:#15161bf2;border-top:1px solid var(--line);
  padding:9px 5px calc(9px + env(safe-area-inset-bottom));
  backdrop-filter:blur(15px);
}
.nav-inner{
  max-width:850px;margin:auto;display:flex;
  justify-content:space-around;gap:3px;
}
.nav button{
  flex:1;border:0;background:transparent;color:var(--muted);
  padding:9px 2px;border-radius:12px;font-size:10px;
}
.nav button.active{color:white;background:var(--panel2)}
.nav button span{display:block;font-size:19px;margin-bottom:4px}
.timer{
  font-size:55px;font-weight:850;letter-spacing:2px;
  text-align:center;margin:20px 0;
}
.timer-ring{
  width:220px;height:220px;border:8px solid var(--panel2);
  border-radius:50%;display:flex;align-items:center;
  justify-content:center;margin:20px auto;
}
.center{text-align:center}
.quote{
  font-size:19px;font-weight:700;line-height:1.5;
  padding:15px 0;
}
.chart{
  display:flex;align-items:flex-end;gap:7px;
  height:150px;padding:15px 0 0;
}
.bar-col{
  flex:1;height:100%;display:flex;flex-direction:column;
  justify-content:flex-end;align-items:center;gap:6px;
  min-width:0;
}
.bar-col i{
  width:70%;max-width:30px;background:var(--red);
  border-radius:6px 6px 2px 2px;min-height:2px;
}
.bar-col span{font-size:9px;color:var(--muted)}
.calendar-grid{
  display:grid;grid-template-columns:repeat(7,1fr);gap:5px;
}
.calendar-day{
  min-height:48px;border:1px solid var(--line);
  border-radius:9px;background:var(--panel2);
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;font-size:12px;
}
.calendar-day.today{border-color:var(--red)}
.calendar-day.marked{background:#263b35;border-color:var(--green)}
.badge{
  border:1px solid var(--line);background:var(--panel2);
  padding:12px;border-radius:13px;margin:5px 0;
}
.badge.unlocked{border-color:#8a7040}
.badge.locked{opacity:.5}
.shop-item{
  display:flex;align-items:center;gap:12px;
  padding:13px 0;border-bottom:1px solid var(--line);
}
.shop-item .emoji{font-size:27px}
.shop-item .details{flex:1}
.toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  background:#30333d;color:white;padding:12px 18px;
  border-radius:12px;z-index:30;font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.toast.show{opacity:1}
.modal{
  display:none;position:fixed;inset:0;background:#000b;
  z-index:20;align-items:center;justify-content:center;padding:18px;
}
.modal.show{display:flex}
.modal-box{
  width:100%;max-width:430px;background:var(--panel);
  border:1px solid var(--line);border-radius:20px;padding:20px;
  max-height:90vh;overflow:auto;
}
.empty{text-align:center;padding:25px 10px;color:var(--muted)}
.small{font-size:11px}
@media(min-width:650px){
  .app{padding:25px}
  .hero{padding:30px}
  h1{font-size:40px}
}
</style>
</head>

<body>
<div class="app">
  <header class="top">
    <div class="brand">RED<span>LINE</span></div>
    <div class="level-pill" id="levelPill">LEVEL 1 · 0 XP</div>
  </header>

  <main id="screen"></main>
</div>

<nav class="nav">
  <div class="nav-inner" id="nav"></div>
</nav>

<div class="toast" id="toast"></div>

<div class="modal" id="taskModal">
  <div class="modal-box">
    <div class="section-head">
      <h2>New task</h2>
      <button class="delete" onclick="closeTaskModal()">✕</button>
    </div>
    <div class="field">
      <label>TASK NAME</label>
      <input id="taskName" maxlength="100" placeholder="What needs to get done?">
    </div>
    <div class="field">
      <label>DATE</label>
      <input id="taskDate" type="date">
    </div>
    <div class="field">
      <label>CATEGORY</label>
      <select id="taskCat"></select>
    </div>
    <div class="field">
      <label>PRIORITY</label>
      <select id="taskPri">
        <option value="0">Normal</option>
        <option value="1">Important</option>
        <option value="2">High</option>
      </select>
    </div>
    <div class="field">
      <label>REPEAT</label>
      <select id="taskRep">
        <option value="none">Does not repeat</option>
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
      </select>
    </div>
    <button class="primary block" onclick="addTask()">Add task</button>
  </div>
</div>

<script>
// ==========================================
// REDLINE 2.0 — CORE SYSTEM
// ==========================================

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');

const dateKey = d =>
  `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

const fromKey = k => new Date(k+'T12:00:00');
const todayKey = () => dateKey(new Date());

function read(key,fallback){
  try{
    const value=localStorage.getItem('rl2-'+key);
    return value===null?fallback:JSON.parse(value);
  }catch{return fallback}
}

function write(key,value){
  localStorage.setItem('rl2-'+key,JSON.stringify(value));
}

let tasks=read('tasks',[]);
let cats=read('cats',['Study','Personal','Fitness','Other']);
let focus=read('focus',{});
let exams=read('exams',[]);
let notes=read('notes',{});
let events=read('events',[]);
let xp=Number(read('xp',0))||0;
let coins=Number(read('coins',0))||0;
let xpAwards=read('xpAwards',{});
let owned=read('owned',['default']);
let avatar=read('avatar','default');
let challenges=read('challenges',[]);
let completedDays=read('completedDays',[]);
let weeklyGoal=Number(read('goal',20))||20;

let tab='today';
let selectedDate=todayKey();
let statsRange='Week';
let calendarMonth=new Date();
let timerLength=25*60;
let timerLeft=25*60;
let timerEndAt=Number(read('timerEndAt',0))||0;
let timerId=null;
let timerRunning=timerEndAt>Date.now();

const NAV=[
  ['today','⌂','Today'],
  ['calendar','▦','Calendar'],
  ['focus','◷','Focus'],
  ['stats','▥','Progress'],
  ['more','✦','More']
];

const quotes=[
  'Small progress is still progress.',
  'Discipline creates freedom.',
  'Your future is built by what you do today.',
  'Start before you feel ready.',
  'Consistency beats intensity.',
  'Focus on what you can control.',
  'Make your actions match your goals.',
  'One good decision can change your day.',
  'You do not need to be perfect. Just consistent.',
  'The secret is to keep showing up.',
  'Stop waiting. Start building.',
  'Your effort today is an investment in tomorrow.',
  'A little better every day adds up.',
  'Make the next hour count.',
  'Do the work. Trust the process.',
  'Progress takes patience.',
  'Your habits shape your future.',
  'Turn your plans into actions.',
  'Be proud of the effort you put in.',
  'One task at a time.'
];

const shop=[
  {id:'default',name:'Classic',emoji:'⚡',price:0},
  {id:'fire',name:'Fire mode',emoji:'🔥',price:100},
  {id:'crown',name:'Royal crown',emoji:'👑',price:200},
  {id:'robot',name:'Robot',emoji:'🤖',price:150},
  {id:'diamond',name:'Diamond',emoji:'💎',price:300},
  {id:'ninja',name:'Ninja',emoji:'🥷',price:250},
  {id:'star',name:'Star',emoji:'🌟',price:175},
  {id:'ghost',name:'Ghost',emoji:'👻',price:125}
];

const save=()=>{
  write('tasks',tasks);
  write('cats',cats);
  write('focus',focus);
  write('exams',exams);
  write('notes',notes);
  write('events',events);
  write('xp',xp);
  write('coins',coins);
  write('xpAwards',xpAwards);
  write('owned',owned);
  write('avatar',avatar);
  write('challenges',challenges);
  write('completedDays',completedDays);
  write('goal',weeklyGoal);
  write('timerEndAt',timerEndAt);
};

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[c]);
}

function toast(message){
  const el=$('toast');
  el.textContent=message;
  el.classList.add('show');
  clearTimeout(window.redlineToast);
  window.redlineToast=setTimeout(()=>{
    el.classList.remove('show');
  },2200);
}

function level(){
  return Math.floor(Math.sqrt(Math.max(0,xp)/100))+1;
}

function levelStart(){
  return (level()-1)**2*100;
}

function levelEnd(){
  return level()**2*100;
}

function xpPercent(){
  return Math.max(0,Math.min(100,
    (xp-levelStart())/(levelEnd()-levelStart())*100
  ));
}

function awardXP(id,amount){
  if(xpAwards[id])return;
  xpAwards[id]=true;
  xp+=amount;
  coins+=Math.max(1,Math.floor(amount/2));
  save();
}

function completedCount(){
  return tasks.filter(t=>t.done).length;
}

function dayTasks(key){
  return tasks.filter(t=>t.date===key)
    .sort((a,b)=>(b.pri||0)-(a.pri||0));
}

function streak(){
  let count=0;
  let d=fromKey(todayKey());

  while(true){
    const k=dateKey(d);
    if(!tasks.some(t=>t.date===k&&t.done))break;
    count++;
    d.setDate(d.getDate()-1);
  }
  return count;
}

function go(name){
  tab=name;
  render();
}

function chooseDate(key){
  selectedDate=key;
  tab='today';
  render();
}

// ==========================================
// TASK SYSTEM
// ==========================================

function openTaskModal(){
  $('taskModal').classList.add('show');
  $('taskDate').value=selectedDate||todayKey();

  $('taskCat').innerHTML=cats.map((c,i)=>
    `<option value="${i}">${escapeHTML(c)}</option>`
  ).join('');

  $('taskName').focus();
}

function closeTaskModal(){
  $('taskModal').classList.remove('show');
}

function addTask(){
  const name=$('taskName').value.trim();
  const date=$('taskDate').value;
  if(!name||!date){
    toast('Enter a task and date');
    return;
  }

  tasks.push({
    id:Date.now()+Math.random(),
    text:name,
    date,
    cat:Number($('taskCat').value)||0,
    pri:Number($('taskPri').value)||0,
    rep:$('taskRep').value,
    done:false,
    seriesId:null
  });

  save();
  $('taskName').value='';
  closeTaskModal();
  render();
  toast('Task added');
}

function toggleTask(id){
  const task=tasks.find(t=>t.id===id);
  if(!task)return;

  task.done=!task.done;

  if(task.done){
    awardXP('task-'+task.id,
      task.pri===2?30:task.pri===1?20:10
    );

    if(task.rep&&task.rep!=='none'&&!task.generated){
      const nextDate=fromKey(task.date);
      nextDate.setDate(
        nextDate.getDate()+(task.rep==='weekly'?7:1)
      );

      const seriesId=task.seriesId||task.id;
      task.seriesId=seriesId;

      const alreadyExists=tasks.some(t=>
        t.seriesId===seriesId&&t.date===dateKey(nextDate)
      );

      if(!alreadyExists){
        tasks.push({
          ...task,
          id:Date.now()+Math.random(),
          date:dateKey(nextDate),
          done:false,
          generated:true,
          seriesId
        });
      }
    }

    const todayList=dayTasks(todayKey());
    if(todayList.length&&todayList.every(t=>t.done)){
      if(!completedDays.includes(todayKey())){
        completedDays.push(todayKey());
        awardXP('perfect-day-'+todayKey(),25);
      }
    }
  }

  save();
  render();
}

function deleteTask(id){
  if(!confirm('Delete this task?'))return;
  tasks=tasks.filter(t=>t.id!==id);
  save();
  render();
  toast('Task deleted');
}

// ==========================================
// FOCUS TIMER
// ==========================================

function syncTimer(){
  if(!timerEndAt)return;

  timerLeft=Math.max(0,Math.ceil((timerEndAt-Date.now())/1000));

  if(timerLeft<=0){
    finishTimer();
  }
}

function finishTimer(){
  clearInterval(timerId);
  timerId=null;
  timerRunning=false;
  timerEndAt=0;

  const mins=Math.round(timerLength/60);
  focus[todayKey()]=(focus[todayKey()]||0)+mins;

  awardXP('focus-'+Date.now(),mins>=45?30:mins>=25?20:10);

  timerLeft=timerLength;
  save();
  render();
  toast('Focus session complete!');
}

function toggleTimer(){
  if(timerRunning){
    syncTimer();
    timerLeft=Math.max(0,timerLeft);
    timerEndAt=0;
    timerRunning=false;
    clearInterval(timerId);
    timerId=null;
    save();
    render();
    return;
  }

  if(timerLeft<=0)timerLeft=timerLength;

  timerEndAt=Date.now()+timerLeft*1000;
  timerRunning=true;
  save();

  clearInterval(timerId);
  timerId=setInterval(()=>{
    syncTimer();
    updateTimerDisplay();
  },500);

  render();
}

function updateTimerDisplay(){
  syncTimer();

  const el=$('screen').querySelector('.timer');
  if(el){
    el.textContent=pad(Math.floor(timerLeft/60))+':'+pad(timerLeft%60);
  }
}

function setTimer(m){
  if(timerRunning){
    toast('Pause the timer first');
    return;
  }
  timerLength=m*60;
  timerLeft=timerLength;
  save();
  render();
}

function resetTimer(){
  clearInterval(timerId);
  timerId=null;
  timerEndAt=0;
  timerRunning=false;
  timerLeft=timerLength;
  save();
  render();
}

document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&timerRunning){
    syncTimer();
    updateTimerDisplay();
  }
});

window.addEventListener('pageshow',()=>{
  if(timerRunning){
    syncTimer();
    if(timerLeft>0){
      clearInterval(timerId);
      timerId=setInterval(()=>{
        syncTimer();
        updateTimerDisplay();
      },500);
    }
  }
});

// ==========================================
// DAILY NOTES
// ==========================================

function saveNote(){
  const value=$('dailyNote').value;
  notes[todayKey()]=value;
  save();
  toast('Daily note saved');
}

// ==========================================
// QUOTES
// ==========================================

function newQuote(){
  let index=Math.floor(Math.random()*quotes.length);
  $('quoteText').textContent=quotes[index];
}

// ==========================================
// CALENDAR AND EXAMS
// ==========================================

function changeMonth(amount){
  calendarMonth.setMonth(calendarMonth.getMonth()+amount);
  render();
}

function addExam(){
  const name=$('examName').value.trim();
  const date=$('examDate').value;

  if(!name||!date){
    toast('Enter an exam name and date');
    return;
  }

  exams.push({id:Date.now(),name,date});
  save();
  render();
  toast('Exam added');
}

function deleteExam(id){
  exams=exams.filter(e=>e.id!==id);
  save();
  render();
}

// ==========================================
// CALENDAR EVENTS
// ==========================================

function addEvent(){
  const name=$('eventName').value.trim();
  const date=$('eventDate').value;
  const time=$('eventTime').value;

  if(!name||!date){
    toast('Enter an event name and date');
    return;
  }

  events.push({
    id:Date.now(),
    name,
    date,
    time
  });

  save();
  render();
  toast('Event added');
}

function deleteEvent(id){
  events=events.filter(e=>e.id!==id);
  save();
  render();
}

// ==========================================
// CHALLENGES
// ==========================================

function toggleChallenge(id){
  const item=challenges.find(x=>x.id===id);
  if(!item)return;

  item.done=!item.done;

  if(item.done){
    awardXP('challenge-'+item.id,20);
  }

  save();
  render();
}

// ==========================================
// STORE AND AVATAR
// ==========================================

function buyItem(id){
  const item=shop.find(x=>x.id===id);
  if(!item)return;

  if(owned.includes(id)){
    avatar=id;
    save();
    render();
    toast('Avatar equipped');
    return;
  }

  if(coins<item.price){
    toast('Not enough coins yet');
    return;
  }

  coins-=item.price;
  owned.push(id);
  avatar=id;
  save();
  render();
  toast('Item purchased!');
}

// ==========================================
// BACKUP AND RESTORE
// ==========================================

function exportData(){
  const data={
    tasks,cats,focus,exams,notes,events,
    xp,coins,xpAwards,owned,avatar,
    challenges,completedDays,weeklyGoal
  };

  const blob=new Blob(
    [JSON.stringify(data,null,2)],
    {type:'application/json'}
  );

  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='redline-backup.json';
  a.click();

  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('Backup exported');
}

function importData(file){
  if(!file)return;

  const reader=new FileReader();

  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!Array.isArray(data.tasks))throw Error();

      tasks=data.tasks;
      cats=data.cats||cats;
      focus=data.focus||{};
      exams=data.exams||[];
      notes=data.notes||{};
      events=data.events||[];
      xp=Number(data.xp)||0;
      coins=Number(data.coins)||0;
      xpAwards=data.xpAwards||{};
      owned=data.owned||['default'];
      avatar=data.avatar||'default';
      challenges=data.challenges||[];
      completedDays=data.completedDays||[];
      weeklyGoal=Number(data.weeklyGoal)||20;

      save();
      render();
      toast('Backup restored');
    }catch{
      toast('Invalid backup file');
    }
  };

  reader.readAsText(file);
}

// ==========================================
// INITIAL SETUP
// ==========================================

function initialise(){
  tasks=Array.isArray(tasks)?tasks:[];
  cats=Array.isArray(cats)&&cats.length?cats:['Study','Personal','Fitness','Other'];
  focus=focus&&typeof focus==='object'?focus:{};
  exams=Array.isArray(exams)?exams:[];
  notes=notes&&typeof notes==='object'?notes:{};
  events=Array.isArray(events)?events:[];
  xpAwards=xpAwards&&typeof xpAwards==='object'?xpAwards:{};
  owned=Array.isArray(owned)?owned:['default'];
  challenges=Array.isArray(challenges)?challenges:[];
  completedDays=Array.isArray(completedDays)?completedDays:[];

  if(timerRunning){
    syncTimer();
    if(timerLeft>0){
      timerId=setInterval(()=>{
        syncTimer();
        updateTimerDisplay();
      },500);
    }
  }

  save();
}
// ==========================================
// NAVIGATION
// ==========================================

function renderNav(){
  $('nav').innerHTML=NAV.map(n=>`
    <button class="${tab===n[0]?'active':''}" onclick="go('${n[0]}')">
      <span>${n[1]}</span>${n[2]}
    </button>
  `).join('');
}

function render(){
  renderNav();

  $('levelPill').textContent=`LEVEL ${level()} · ${xp} XP`;

  const screens={
    today:renderToday,
    calendar:renderCalendar,
    focus:renderFocus,
    stats:renderStats,
    more:renderMore
  };

  (screens[tab]||renderToday)();
}

// ==========================================
// TODAY DASHBOARD
// ==========================================

function renderToday(){
  const today=todayKey();
  const list=dayTasks(selectedDate);
  const done=list.filter(t=>t.done).length;
  const total=list.length;
  const percent=total?Math.round(done/total*100):0;

  const d=fromKey(selectedDate);
  const label=selectedDate===today?'Today':
    d.toLocaleDateString('en-IN',{
      weekday:'long',day:'numeric',month:'long'
    });

  const week=[];
  const start=new Date();
  start.setDate(start.getDate()-start.getDay());

  for(let i=0;i<7;i++){
    const x=new Date(start);
    x.setDate(start.getDate()+i);
    week.push(x);
  }

  const todayFocus=focus[today]||0;

  $('screen').innerHTML=`
    <section class="hero">
      <div class="eyebrow">YOUR DAILY MISSION</div>
      <h1>Make today<br><span>count.</span></h1>
      <p>One task at a time. Keep moving.</p>
      <button class="primary" onclick="openTaskModal()">＋ Add a task</button>
      <div class="section-head">
        <b>${done} / ${total} tasks completed</b>
        <b>${percent}%</b>
      </div>
      <div class="progress-track">
        <i style="width:${percent}%"></i>
      </div>
    </section>

    <div class="date-strip">
      ${week.map(x=>{
        const k=dateKey(x);
        const n=tasks.filter(t=>t.date===k&&t.done).length;
        return `
          <button class="date-btn ${k===selectedDate?'active':''}"
            onclick="chooseDate('${k}')">
            <span>${x.toLocaleDateString('en-IN',{weekday:'short'})}</span>
            <b>${x.getDate()}</b>
            <i>${n?'✓':'·'}</i>
          </button>`;
      }).join('')}
    </div>

    <div class="section-head">
      <div>
        <div class="eyebrow">YOUR SCHEDULE</div>
        <h2>${escapeHTML(label)}</h2>
      </div>
      <button class="secondary" onclick="openTaskModal()">＋ Add</button>
    </div>

    <div class="card">
      ${total?list.map(t=>`
        <div class="task ${t.done?'done':''}">
          <input type="checkbox" ${t.done?'checked':''}
            onchange="toggleTask(${Number(t.id)})">
          <div class="task-name">
            ${escapeHTML(t.text)}
            <small>
              ${escapeHTML(cats[t.cat]||'Other')}
              · ${t.pri===2?'High priority':t.pri===1?'Important':'Normal'}
              ${t.rep&&t.rep!=='none'?' · Repeats':''}
            </small>
          </div>
          <button class="delete" onclick="deleteTask(${Number(t.id)})">×</button>
        </div>
      `).join(''):`<div class="empty">
        <h2>Nothing scheduled</h2>
        <p>Add a task and get started.</p>
      </div>`}
    </div>

    <div class="grid">
      <div class="card stat-card">
        <div class="eyebrow">CURRENT STREAK</div>
        <div class="stat-number">${streak()}<small> days</small></div>
      </div>
      <div class="card stat-card">
        <div class="eyebrow">FOCUS TODAY</div>
        <div class="stat-number">${Math.floor(todayFocus/60)}<small>h</small> ${todayFocus%60}<small>m</small></div>
      </div>
    </div>

    <div class="card">
      <div class="eyebrow">YOUR JOURNEY</div>
      <h2>Level ${level()} · ${xp} XP</h2>
      <div class="progress-track">
        <i style="width:${xpPercent()}%"></i>
      </div>
      <p class="muted">${levelEnd()-xp} XP until your next level.</p>
      <p class="muted">🪙 ${coins} coins available</p>
    </div>

    <div class="card">
      <div class="eyebrow">DAILY REFLECTION</div>
      <h2>How was your day?</h2>
      <textarea id="dailyNote" placeholder="Write down your thoughts...">${escapeHTML(notes[today]||'')}</textarea>
      <button class="primary block" onclick="saveNote()">Save my note</button>
    </div>

    <div class="card">
      <div class="eyebrow">A LITTLE MOTIVATION</div>
      <div class="quote" id="quoteText"></div>
      <button class="secondary block" onclick="newQuote()">Roll another quote ↻</button>
    </div>
  `;

  newQuote();
}

// ==========================================
// FOCUS SCREEN
// ==========================================

function renderFocus(){
  syncTimer();

  const minutes=Math.floor(timerLeft/60);
  const seconds=timerLeft%60;
  const total=Object.values(focus).reduce(
    (a,b)=>a+(Number(b)||0),0
  );

  $('screen').innerHTML=`
    <div class="page-heading">
      <div class="eyebrow">DEEP WORK MODE</div>
      <h1>Lock in.</h1>
      <p class="muted">One session. One goal. No distractions.</p>
    </div>

    <div class="card center">
      <div class="eyebrow">FOCUS SESSION</div>
      <div class="timer-ring">
        <div class="timer">${pad(minutes)}:${pad(seconds)}</div>
      </div>

      <div class="grid">
        ${[15,25,45,60].map(m=>`
          <button class="secondary" onclick="setTimer(${m})">${m} min</button>
        `).join('')}
      </div>

      <div class="grid" style="margin-top:15px">
        <button class="secondary" onclick="resetTimer()">Reset</button>
        <button class="primary" onclick="toggleTimer()">
          ${timerRunning?'Pause':'Start focus'}
        </button>
      </div>

      <p class="muted">Your session is saved using its end time.</p>
    </div>

    <div class="grid">
      <div class="card stat-card">
        <div class="eyebrow">TOTAL FOCUS</div>
        <div class="stat-number">${Math.floor(total/60)}<small>h</small> ${total%60}<small>m</small></div>
      </div>
      <div class="card stat-card">
        <div class="eyebrow">TODAY</div>
        <div class="stat-number">${focus[todayKey()]||0}<small> min</small></div>
      </div>
    </div>
  `;
}

// ==========================================
// CALENDAR
// ==========================================

function renderCalendar(){
  const year=calendarMonth.getFullYear();
  const month=calendarMonth.getMonth();

  const first=new Date(year,month,1);
  const offset=first.getDay();
  const count=new Date(year,month+1,0).getDate();

  const cells=[];

  for(let i=0;i<offset;i++)cells.push(null);
  for(let i=1;i<=count;i++)cells.push(i);

  $('screen').innerHTML=`
    <div class="page-heading">
      <div class="eyebrow">PLAN YOUR LIFE</div>
      <h1>Your calendar.</h1>
      <p class="muted">Keep track of tasks, events and exams.</p>
    </div>

    <div class="card">
      <div class="section-head">
        <button class="secondary" onclick="changeMonth(-1)">‹</button>
        <h2>${calendarMonth.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</h2>
        <button class="secondary" onclick="changeMonth(1)">›</button>
      </div>

      <div class="calendar-grid">
        ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`
          <div class="center muted small">${x}</div>
        `).join('')}

        ${cells.map(day=>{
          if(!day)return '<div></div>';

          const k=dateKey(new Date(year,month,day));
          const hasTasks=tasks.some(t=>t.date===k&&t.done);
          const today=k===todayKey();

          return `
            <button class="calendar-day ${today?'today':''} ${hasTasks?'marked':''}"
              onclick="chooseDate('${k}')">
              ${day}
              <small>${hasTasks?'✓':''}</small>
            </button>`;
        }).join('')}
      </div>
    </div>

    <div class="card">
      <div class="eyebrow">ADD AN EVENT</div>
      <h2>Something important?</h2>

      <div class="field">
        <label>EVENT NAME</label>
        <input id="eventName" placeholder="Class, meeting, activity...">
      </div>
      <div class="field">
        <label>DATE</label>
        <input id="eventDate" type="date" value="${todayKey()}">
      </div>
      <div class="field">
        <label>TIME</label>
        <input id="eventTime" type="time">
      </div>
      <button class="primary block" onclick="addEvent()">Add event</button>
    </div>

    <div class="card">
      <div class="eyebrow">UPCOMING EVENTS</div>
      ${events.length?events.slice().sort((a,b)=>
        a.date.localeCompare(b.date)
      ).map(e=>`
        <div class="task">
          <div class="task-name">
            ${escapeHTML(e.name)}
            <small>${e.date} ${escapeHTML(e.time||'')}</small>
          </div>
          <button class="delete" onclick="deleteEvent(${Number(e.id)})">×</button>
        </div>
      `).join(''):'<p class="muted">No events yet.</p>'}
    </div>

    <div class="card">
      <div class="eyebrow">EXAM COUNTDOWN</div>
      <h2>Add an exam</h2>
      <div class="field">
        <label>SUBJECT</label>
        <input id="examName" placeholder="Mathematics">
      </div>
      <div class="field">
        <label>EXAM DATE</label>
        <input id="examDate" type="date" min="${todayKey()}">
      </div>
      <button class="primary block" onclick="addExam()">Add exam</button>

      ${exams.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>{
        const days=Math.ceil((fromKey(e.date)-fromKey(todayKey()))/86400000);
        return `
          <div class="task">
            <div class="task-name">
              ${escapeHTML(e.name)}
              <small>${days<0?'Past':days===0?'Today':days+' days left'}</small>
            </div>
            <button class="delete" onclick="deleteExam(${Number(e.id)})">×</button>
          </div>`;
      }).join('')}
    </div>
  `;
}

// ==========================================
// PROGRESS AND 100-DAY TRACKER
// ==========================================

function renderStats(){
  const totalDone=completedCount();
  const totalTasks=tasks.length;
  const rate=totalTasks?Math.round(totalDone/totalTasks*100):0;

  const totalFocus=Object.values(focus).reduce(
    (a,b)=>a+(Number(b)||0),0
  );

  const data=[];

  for(let i=6;i>=0;i--){
    const d=new Date();
    d.setDate(d.getDate()-i);
    const k=dateKey(d);
    const items=tasks.filter(t=>t.date===k);

    data.push({
      label:d.toLocaleDateString('en-IN',{weekday:'short'}),
      done:items.filter(t=>t.done).length,
      total:items.length
    });
  }

  const max=Math.max(1,...data.map(x=>x.total));

  $('screen').innerHTML=`
    <div class="page-heading">
      <div class="eyebrow">THE BIG PICTURE</div>
      <h1>Your progress.</h1>
      <p class="muted">Look at how far you've come.</p>
    </div>

    <div class="grid">
      <div class="card stat-card">
        <div class="eyebrow">TASKS DONE</div>
        <div class="stat-number">${totalDone}</div>
      </div>
      <div class="card stat-card">
        <div class="eyebrow">COMPLETION</div>
        <div class="stat-number">${rate}%</div>
      </div>
      <div class="card stat-card">
        <div class="eyebrow">FOCUS HOURS</div>
        <div class="stat-number">${(totalFocus/60).toFixed(1)}</div>
      </div>
      <div class="card stat-card">
        <div class="eyebrow">STREAK</div>
        <div class="stat-number">${streak()} days</div>
      </div>
    </div>

    <div class="card">
      <div class="eyebrow">LAST 7 DAYS</div>
      <h2>Your activity</h2>
      <div class="chart">
        ${data.map(x=>`
          <div class="bar-col" title="${x.done}/${x.total}">
            <i style="height:${Math.max(2,x.done/max*100)}%"></i>
            <span>${x.label}</span>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="card">
      <div class="eyebrow">100-DAY CHALLENGE</div>
      <h2>Your consistency calendar</h2>
      <p class="muted">A marked day means all tasks scheduled that day were completed.</p>
      <div class="calendar-grid">
        ${Array.from({length:100},(_,i)=>{
          const d=new Date();
          d.setDate(d.getDate()-(99-i));
          const k=dateKey(d);
          const marked=completedDays.includes(k);

          return `
            <div class="calendar-day ${marked?'marked':''}">
              ${d.getDate()}
              <small>${marked?'✓':''}</small>
            </div>`;
        }).join('')}
      </div>
      <p class="muted">${completedDays.length} perfect days recorded.</p>
    </div>

    <div class="card">
      <div class="eyebrow">YOUR EXPERIENCE</div>
      <h2>Level ${level()}</h2>
      <div class="stat-number">${xp} XP</div>
      <div class="progress-track"><i style="width:${xpPercent()}%"></i></div>
      <p class="muted">${levelEnd()-xp} XP until next level.</p>
    </div>
  `;
}

// ==========================================
// ACHIEVEMENTS
// ==========================================

function renderAchievements(){
  const totalFocus=Object.values(focus).reduce(
    (a,b)=>a+(Number(b)||0),0
  );

  const achievements=[
    ['🌱','First step','Complete your first task',completedCount()>=1],
    ['⚡','Getting started','Complete 10 tasks',completedCount()>=10],
    ['🔥','Consistent','Complete 25 tasks',completedCount()>=25],
    ['🏆','Task master','Complete 100 tasks',completedCount()>=100],
    ['⏱️','Deep focus','Record 1 hour of focus',totalFocus>=60],
    ['🧠','Study mode','Record 5 hours of focus',totalFocus>=300],
    ['💎','High achiever','Earn 1,000 XP',xp>=1000],
    ['📚','Level five','Reach Level 5',level()>=5],
    ['📅','Planner','Add an exam',exams.length>=1],
    ['📝','Reflect','Write a daily note',Object.values(notes).some(x=>String(x).trim())],
    ['🎯','Perfect day','Complete all tasks on a day',completedDays.length>=1],
    ['🪙','Collector','Earn 500 coins',coins>=500]
  ];

  const unlocked=achievements.filter(a=>a[3]).length;

  return `
    <div class="card">
      <div class="eyebrow">ACHIEVEMENTS</div>
      <h2>${unlocked} / ${achievements.length} unlocked</h2>
      <div class="progress-track">
        <i style="width:${unlocked/achievements.length*100}%"></i>
      </div>
    </div>
    ${achievements.map(a=>`
      <div class="badge ${a[3]?'unlocked':'locked'}">
        <b>${a[0]} ${a[1]}</b>
        <p class="muted">${a[2]}</p>
        <small>${a[3]?'✓ Unlocked':'Locked'}</small>
      </div>
    `).join('')}
  `;
}

// ==========================================
// CHALLENGES
// ==========================================

function renderChallenges(){
  const options=[
    ['morning','🌅','Morning momentum','Complete one task before noon'],
    ['focus','⏱️','Focus session','Complete one focus session'],
    ['planner','📅','Plan ahead','Add three tasks'],
    ['reflection','📝','Daily reflection','Write a daily note'],
    ['reading','📖','Learning time','Spend some time learning something new'],
    ['consistency','🎯','Consistency','Complete your planned tasks today']
  ];

  return `
    <div class="card">
      <div class="eyebrow">YOUR CHALLENGES</div>
      <h2>Build good habits.</h2>
      <p class="muted">Choose realistic challenges that fit your day.</p>
    </div>
    ${options.map(c=>{
      const done=challenges.some(x=>x.id===c[0]&&x.done);

      return `
        <div class="badge ${done?'unlocked':''}">
          <b>${c[1]} ${c[2]}</b>
          <p class="muted">${c[3]}</p>
          <button class="${done?'secondary':'primary'}"
            onclick="toggleChallenge('${c[0]}')">
            ${done?'Completed ✓':'Mark complete'}
          </button>
        </div>`;
    }).join('')}
  `;
}

// ==========================================
// STORE
// ==========================================

function renderStore(){
  return `
    <div class="card center">
      <div class="eyebrow">REDLINE STORE</div>
      <h1>🪙 ${coins} coins</h1>
      <p class="muted">Earn coins by completing tasks and focus sessions.</p>
      <h2>Your avatar: ${shop.find(x=>x.id===avatar)?.emoji||'⚡'}</h2>
    </div>

    ${shop.map(item=>`
      <div class="shop-item">
        <div class="emoji">${item.emoji}</div>
        <div class="details">
          <b>${item.name}</b>
          <div class="muted">${item.price===0?'Free':item.price+' coins'}</div>
        </div>
        <button class="secondary" onclick="buyItem('${item.id}')">
          ${avatar===item.id?'Equipped':owned.includes(item.id)?'Equip':item.price===0?'Get':'Buy'}
        </button>
      </div>
    `).join('')}
  `;
}

// ==========================================
// MORE SCREEN
// ==========================================

function renderMore(){
  $('screen').innerHTML=`
    <div class="page-heading">
      <div class="eyebrow">YOUR CONTROL CENTRE</div>
      <h1>More.</h1>
      <p class="muted">Build your system. Track your progress.</p>
    </div>

    <div class="card">
      <div class="eyebrow">YOUR PROFILE</div>
      <h2>${shop.find(x=>x.id===avatar)?.emoji||'⚡'} Level ${level()}</h2>
      <p class="muted">${xp} XP · ${coins} coins</p>
      <div class="progress-track"><i style="width:${xpPercent()}%"></i></div>
    </div>

    <div class="card">
      <div class="section-head"><h2>🏆 Achievements</h2></div>
      ${renderAchievements()}
    </div>

    <div class="card">
      <div class="section-head"><h2>🎮 Challenges</h2></div>
      ${renderChallenges()}
    </div>

    <div class="card">
      <div class="section-head"><h2>🛍️ Avatar store</h2></div>
      ${renderStore()}
    </div>

    <div class="card">
      <div class="eyebrow">WEEKLY GOAL</div>
      <h2>Set your target</h2>
      <input id="goalInput" type="number" min="1" max="500" value="${weeklyGoal}">
      <button class="primary block" onclick="
        const n=Number($('goalInput').value);
        if(!Number.isInteger(n)||n<1||n>500){toast('Choose 1 to 500');}
        else{weeklyGoal=n;save();render();toast('Goal updated');}
      ">Save goal</button>
    </div>

    <div class="card">
      <div class="eyebrow">YOUR DATA</div>
      <h2>Backup and restore</h2>
      <button class="secondary block" onclick="exportData()">Export backup</button>
      <div class="field">
        <label>RESTORE A BACKUP</label>
        <input type="file" accept=".json,application/json"
          onchange="importData(this.files[0])">
      </div>
    </div>
  `;
}

// ==========================================
// START APP
// ==========================================

initialise();
render();

</script>
</body>
</html>
