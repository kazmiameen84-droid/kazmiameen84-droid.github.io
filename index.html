<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081426">
<meta name="description" content="Redline — build your momentum.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Redline 2.4</title>
<style>
:root{
  color-scheme:dark;
  --bg:#071426;--panel:#0d1d33;--panel2:#142943;--line:#233b58;
  --ink:#edf4ff;--muted:#91a4bd;--red:#f04459;--red2:#ff6475;
  --green:#55d6a2;--amber:#f4c16b;--blue:#78aaff;--purple:#b99cff;
  --shadow:0 16px 40px #02091455;--radius:20px;--accent-glow:#f0445940;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#edf3fb;--panel:#ffffff;--panel2:#e7eef8;--line:#d2deec;
  --ink:#12243b;--muted:#657991;--red:#d92f49;--red2:#ed4960;
  --green:#16885f;--amber:#a66a0a;--blue:#356fc6;--purple:#7956bd;
  --shadow:0 14px 35px #29415a16;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{min-height:100vh}
.app{animation:appIn .45s ease both}
@keyframes appIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card,.hero,.month-cell,.date-btn{transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
